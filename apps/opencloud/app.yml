---
# OpenCloud deployment playbook
- name: Deploy OpenCloud
  import_playbook: ../../playbooks/deploy-helm-app.yml
  vars:
    app_chart_file: "{{ inventory_dir }}/apps/opencloud/Chart.yml"
    app_values_file: "{{ inventory_dir }}/apps/opencloud/values.yml"
    prerequisites_playbook: "{{ inventory_dir }}/apps/opencloud/prerequisites.yml"
