---
# Authentik Identity Provider

# Disable bundled PostgreSQL - using CNPG
postgresql:
  enabled: false

# Disable bundled Redis - not needed in 2025.10+
redis:
  enabled: false

authentik:
  secret_key: "" # Loaded from env via authentik-secrets

  postgresql:
    host: authentik-db-rw
    name: authentik
    user: authentik
    port: 5432

server:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      # CPU increased from 500m: server was hitting limit (495m/500m observed),
      # causing throttling, slow responses and 502 errors.
      # Memory increased from 512Mi: server was near OOM (511Mi/512Mi observed).
      cpu: 1000m
      memory: 1Gi

  # Known bug: authentik_prometheus_tmp metric files grow unboundedly in
  # /dev/shm, exhausting the default 64Mi Kubernetes limit and causing a
  # "no space left on device" panic on startup.
  # Tracked upstream: goauthentik/authentik#10768 (closed wontfix).
  # 512Mi delays recurrence to ~48h per issue reports; no upstream fix
  # exists as of 2025.12.1. Monitor and consider disabling metrics if
  # this becomes too frequent.
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 512Mi
  volumeMounts:
    - name: shm
      mountPath: /dev/shm

  env:
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db-credentials
          key: password

  envFrom:
    - secretRef:
        name: authentik-secrets

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      # Required for WebSocket support
      traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
      traefik.ingress.kubernetes.io/service.sticky.cookie.name: "authentik_session"
      cert-manager.io/cluster-issuer: letsencrypt-prod
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Authentik"
      gethomepage.dev/description: "Identity Provider & SSO"
      gethomepage.dev/group: "Admin"
      gethomepage.dev/icon: "authentik.png"
    hosts:
      - authentik.jardoole.xyz
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: authentik-tls
        hosts:
          - authentik.jardoole.xyz

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  env:
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db-credentials
          key: password

  envFrom:
    - secretRef:
        name: authentik-secrets
