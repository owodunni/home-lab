---
# Prerequisites for kube-prometheus-stack
# Creates Alertmanager config secret, Grafana OIDC secret, and NetworkPolicies

# Grafana Authentik OIDC Secret
# Contains OAuth2 credentials for Authentik integration
- name: Create Grafana Authentik OIDC secret
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-authentik-oidc
        namespace: monitoring
        labels:
          app.kubernetes.io/name: grafana
          managed-by: ansible
      type: Opaque
      stringData:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ vault_authentik_grafana_client_id }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ vault_authentik_grafana_client_secret }}"
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Create Alertmanager config secret
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: alertmanager-config
        namespace: monitoring
        labels:
          app.kubernetes.io/name: alertmanager
          managed-by: ansible
      type: Opaque
      stringData:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            smtp_smarthost: "{{ smtp_host }}:{{ smtp_port }}"
            smtp_from: "{{ smtp_from }}"
            smtp_auth_username: "{{ vault_smtp_username }}"
            smtp_auth_password: "{{ vault_smtp_password }}"
            smtp_require_tls: true
          route:
            receiver: "email-notifications"
            group_by: ["alertname", "namespace"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: "null"
                matchers:
                  - alertname="Watchdog"
          receivers:
            - name: "null"
            - name: "email-notifications"
              email_configs:
                - to: "{{ vault_smtp_username }}"
                  send_resolved: true
          inhibit_rules:
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity=~"warning|info"
              equal:
                - namespace
                - alertname
            - source_matchers:
                - severity="warning"
              target_matchers:
                - severity="info"
              equal:
                - namespace
                - alertname
    state: present
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Create NetworkPolicy for Prometheus scraping
  kubernetes.core.k8s:
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-prometheus-scraping
        namespace: monitoring
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
        policyTypes:
          - Egress
        egress:
          # DNS resolution via CoreDNS
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - port: 53
                protocol: TCP
              - port: 53
                protocol: UDP
          # Kubernetes API for service discovery (control plane nodes)
          - to:
              - ipBlock:
                  cidr: 192.168.1.0/24
            ports:
              - port: 6443
                protocol: TCP
              - port: 9100
                protocol: TCP
              - port: 10250
                protocol: TCP
          # Scrape kube-system pods (kubelet, coredns, etc.)
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - port: 10250
                protocol: TCP
              - port: 10255
                protocol: TCP
              - port: 9153
                protocol: TCP
          # Scrape pods in all namespaces (for ServiceMonitors)
          - to:
              - namespaceSelector: {}
            ports:
              - port: 8080
                protocol: TCP
              - port: 8443
                protocol: TCP
              - port: 9090
                protocol: TCP
              - port: 9093
                protocol: TCP
              - port: 9100
                protocol: TCP
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Create NetworkPolicy for Grafana sidecars
  kubernetes.core.k8s:
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-grafana-k8s-api
        namespace: monitoring
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
        policyTypes:
          - Egress
        egress:
          # DNS resolution via CoreDNS
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - port: 53
                protocol: TCP
              - port: 53
                protocol: UDP
          # Kubernetes API (DNAT'd to control plane nodes)
          - to:
              - ipBlock:
                  cidr: 192.168.1.0/24
            ports:
              - port: 6443
                protocol: TCP
          # Prometheus and Alertmanager in monitoring namespace
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
            ports:
              - port: 9090
                protocol: TCP
              - port: 9093
                protocol: TCP
    kubeconfig: /etc/rancher/k3s/k3s.yaml

- name: Create NetworkPolicy for Alertmanager SMTP egress
  kubernetes.core.k8s:
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-alertmanager-smtp
        namespace: monitoring
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager
        policyTypes:
          - Egress
        egress:
          # DNS resolution
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - port: 53
                protocol: TCP
              - port: 53
                protocol: UDP
          # SMTP to Gmail (port 587 for STARTTLS)
          - to:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              - port: 587
                protocol: TCP
    kubeconfig: /etc/rancher/k3s/k3s.yaml

# Network policy for Grafana OIDC authentication with Authentik
- name: Create NetworkPolicy for Grafana Authentik OIDC
  kubernetes.core.k8s:
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-grafana-authentik
        namespace: monitoring
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
        policyTypes:
          - Egress
        egress:
          # Authentik namespace for OIDC authentication
          - to:
              - namespaceSelector:
                  matchLabels:
                    name: authentik
            ports:
              - port: 9000
                protocol: TCP
    kubeconfig: /etc/rancher/k3s/k3s.yaml
