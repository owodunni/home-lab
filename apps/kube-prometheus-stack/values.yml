---
# kube-prometheus-stack Helm Values
# Comprehensive monitoring with Prometheus, Grafana, and Alertmanager

prometheus:
  prometheusSpec:
    # Persistent storage for metrics data
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # Resource limits for Pi CM5 nodes
    # Memory increased to handle WAL replay on NFS storage
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 2Gi
    # Init container resource limits
    initContainers:
      - name: init-config-reloader
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
    # Config reloader sidecar resource limits
    containers:
      - name: config-reloader
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
    nodeSelector:
      kubernetes.io/os: linux

  # Ingress for Prometheus UI
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # Authentik forward auth protection
      traefik.ingress.kubernetes.io/router.middlewares: kube-system-authentik-forward-auth@kubernetescrd
      # Homepage auto-discovery
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Prometheus"
      gethomepage.dev/description: "Metrics & Monitoring"
      gethomepage.dev/group: "Monitoring"
      gethomepage.dev/icon: "prometheus.png"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=prometheus"
    hosts:
      - prometheus.jardoole.xyz
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: prometheus-tls-secret
        hosts:
          - prometheus.jardoole.xyz

grafana:
  # Persistent storage for dashboards and data
  persistence:
    enabled: true
    storageClassName: nfs
    size: 5Gi

  # Authentik OIDC credentials from secret
  envFromSecrets:
    - name: grafana-authentik-oidc
      optional: false

  # Grafana OIDC configuration for Authentik
  # Client ID/Secret provided via environment variables from secret
  grafana.ini:
    server:
      root_url: https://grafana.jardoole.xyz
    auth.generic_oauth:
      enabled: true
      name: Authentik
      allow_sign_up: true
      scopes: openid profile email groups
      # Browser redirect - must be external URL
      auth_url: https://authentik.jardoole.xyz/application/o/authorize/
      # Server-side calls - use internal cluster URLs to avoid network policy issues
      token_url: http://authentik-server.authentik.svc.cluster.local/application/o/token/
      api_url: http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/
      # Logout URL - browser redirect, must be external
      signout_redirect_url: https://authentik.jardoole.xyz/application/o/grafana/end-session/
      # Role mapping: Admins group → Admin, all others → Viewer
      # Uses simplified tiered groups (Admins/Users) instead of per-app groups
      role_attribute_path: >-
        contains(groups[*], 'Admins') && 'Admin' || 'Viewer'
      # Allow OIDC users to be assigned as Org Admin
      allow_assign_grafana_admin: true

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Sidecar configuration for auto-loading dashboards/datasources
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true
      # Trigger reload on initial sync to fix race condition where
      # datasource config is written after Grafana finishes provisioning
      skipReload: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Init container for volume permissions
  initChownData:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  nodeSelector:
    kubernetes.io/os: linux

  # Ingress for Grafana UI
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # Homepage auto-discovery
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Grafana"
      gethomepage.dev/description: "Metrics Visualization"
      gethomepage.dev/group: "Monitoring"
      gethomepage.dev/icon: "grafana.png"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=grafana"
    hosts:
      - grafana.jardoole.xyz
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-tls-secret
        hosts:
          - grafana.jardoole.xyz

alertmanager:
  # Use external secret for alertmanager config (created in prerequisites.yml)
  # This allows Ansible to template vault variables before deployment
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-config
    # Persistent storage for alert data
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # Init container resource limits
    initContainers:
      - name: init-config-reloader
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
    # Config reloader sidecar resource limits
    containers:
      - name: config-reloader
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
    nodeSelector:
      kubernetes.io/os: linux

  # Ingress for AlertManager UI
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # Authentik forward auth protection
      traefik.ingress.kubernetes.io/router.middlewares: kube-system-authentik-forward-auth@kubernetescrd
      # Homepage auto-discovery
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "AlertManager"
      gethomepage.dev/description: "Alert Management"
      gethomepage.dev/group: "Monitoring"
      gethomepage.dev/icon: "alertmanager.png"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=alertmanager"
    hosts:
      - alert-manager.jardoole.xyz
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: alert-manager-tls-secret
        hosts:
          - alert-manager.jardoole.xyz

prometheusOperator:
  # Resource limits for operator
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Admission webhook patch job resource limits
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

kube-state-metrics:
  # Resource limits for kube-state-metrics
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  # Resource limits for node exporter (runs on all nodes)
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
