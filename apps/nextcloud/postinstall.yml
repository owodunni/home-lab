---
# Nextcloud Post-install Configuration
# 1. Patches deployment with hostAliases for Authentik (hairpin NAT workaround)
# 2. Installs and configures user_oidc app for Authentik SSO
#
# OIDC flow requires browser redirect to Authentik, so we must use external URLs.
# hostAliases routes authentik.jardoole.xyz to Traefik's ClusterIP internally,
# allowing the pod to reach the external URL without leaving the cluster.

# Get Traefik service ClusterIP for hostAliases
- name: Get Traefik service ClusterIP
  kubernetes.core.k8s_info:
    kind: Service
    namespace: kube-system
    name: traefik
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: traefik_svc

- name: Set Traefik ClusterIP fact
  ansible.builtin.set_fact:
    traefik_cluster_ip: "{{ traefik_svc.resources[0].spec.clusterIP }}"

# Patch deployment with hostAliases to resolve external Authentik URL internally
- name: Patch Nextcloud deployment with hostAliases
  kubernetes.core.k8s_json_patch:
    kind: Deployment
    namespace: nextcloud
    name: nextcloud
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    patch:
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - ip: "{{ traefik_cluster_ip }}"
            hostnames:
              - authentik.jardoole.xyz
  register: patch_result

# Wait for rollout after patch
- name: Wait for deployment rollout
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: nextcloud
    name: nextcloud
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: deployment_status
  until:
    - deployment_status.resources[0].status.readyReplicas | default(0) == deployment_status.resources[0].spec.replicas
    - deployment_status.resources[0].status.updatedReplicas | default(0) == deployment_status.resources[0].spec.replicas
  retries: 30
  delay: 10
  when: patch_result.changed

- name: Get Nextcloud pod name
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: nextcloud
    label_selectors:
      - app.kubernetes.io/name=nextcloud
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: nextcloud_pods
  until:
    - nextcloud_pods.resources | length > 0
    - nextcloud_pods.resources[0].status.phase == 'Running'
    - nextcloud_pods.resources[0].status.containerStatuses | selectattr('ready', 'equalto', true) | list | length > 0
  retries: 30
  delay: 10

- name: Set pod name fact
  ansible.builtin.set_fact:
    nextcloud_pod: "{{ nextcloud_pods.resources[0].metadata.name }}"

- name: Check if user_oidc app is installed
  kubernetes.core.k8s_exec:
    namespace: nextcloud
    pod: "{{ nextcloud_pod }}"
    container: nextcloud
    command: php occ app:list --output=json
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: app_list
  changed_when: false

- name: Parse installed apps
  ansible.builtin.set_fact:
    oidc_installed: "{{ 'user_oidc' in (app_list.stdout | from_json).enabled | default({}) }}"

- name: Install user_oidc app
  kubernetes.core.k8s_exec:
    namespace: nextcloud
    pod: "{{ nextcloud_pod }}"
    container: nextcloud
    command: php occ app:install user_oidc
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: install_result
  when: not oidc_installed
  failed_when:
    - install_result.rc != 0
    - "'already installed' not in install_result.stdout | default('')"

- name: Enable user_oidc app
  kubernetes.core.k8s_exec:
    namespace: nextcloud
    pod: "{{ nextcloud_pod }}"
    container: nextcloud
    command: php occ app:enable user_oidc
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: enable_result
  changed_when: "'enabled' in enable_result.stdout | default('')"
  failed_when:
    - enable_result.rc != 0
    - "'already enabled' not in enable_result.stdout | default('')"

# Use external discovery URL - hostAliases routes it to Traefik internally
# Browser redirects will use external URLs that users can reach
- name: Configure Authentik OIDC provider
  kubernetes.core.k8s_exec:
    namespace: nextcloud
    pod: "{{ nextcloud_pod }}"
    container: nextcloud
    command: >-
      php occ user_oidc:provider authentik
      --clientid="{{ vault_authentik_nextcloud_client_id }}"
      --clientsecret="{{ vault_authentik_nextcloud_client_secret }}"
      --discoveryuri="https://authentik.jardoole.xyz/application/o/nextcloud/.well-known/openid-configuration"
      --scope="openid email profile"
      --unique-uid=1
      --mapping-uid="preferred_username"
      --check-bearer=1
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  register: provider_config
  no_log: true

- name: Display OIDC configuration status
  ansible.builtin.debug:
    msg: |
      Nextcloud OIDC Configuration:
      - hostAliases: authentik.jardoole.xyz -> {{ traefik_cluster_ip }} (Traefik)
      - user_oidc app: {{ 'Already installed' if oidc_installed else 'Installed' }}
      - Authentik provider: Configured with external discovery URL
