---
# Nextcloud with Authentik SSO
# Chart: nextcloud/nextcloud v8.9.0

# Use Apache flavor (default, simpler than FPM)
image:
  flavor: apache
  pullPolicy: IfNotPresent

# Run on Pi CM5 nodes only (ARM64), avoid beelink
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - arm64
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - beelink

# Nextcloud configuration
nextcloud:
  host: cloud.jardoole.xyz
  # Admin + SMTP credentials from single secret
  existingSecret:
    enabled: true
    secretName: nextcloud-credentials
    usernameKey: admin-username
    passwordKey: admin-password
    smtpUsernameKey: smtp-username
    smtpPasswordKey: smtp-password
    smtpHostKey: smtp-host
  mail:
    enabled: true
    fromAddress: alert
    domain: jardoole.xyz
    smtp:
      host: smtp.gmail.com
      port: 587
      secure: tls
      authtype: LOGIN
  configs:
    proxy.config.php: |
      <?php
      $CONFIG = [
        'trusted_proxies' => ['10.0.0.0/8'],
        'overwriteprotocol' => 'https',
      ];
    custom.config.php: |
      <?php
      $CONFIG = [
        'default_phone_region' => 'AU',
        'maintenance_window_start' => 1,
        // Allow OIDC connections to internal Authentik URL
        'allow_local_remote_servers' => true,
      ];

# Disable internal database - using CNPG
internalDatabase:
  enabled: false

# External PostgreSQL (CNPG)
externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-db-rw.nextcloud.svc.cluster.local
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-db-helm
    usernameKey: db-username
    passwordKey: db-password

# Redis for caching and locking (no persistence needed - it's just a cache)
redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: nextcloud-redis-credentials
    existingSecretPasswordKey: redis-password
  master:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    persistence:
      enabled: false
  replica:
    replicaCount: 0

# Persistent storage on NFS
persistence:
  enabled: true
  storageClass: nfs
  size: 100Gi
  accessMode: ReadWriteOnce

# Resource limits
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# Ingress configuration
ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: nextcloud-nextcloud-headers@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Nextcloud"
    gethomepage.dev/description: "File Sync & Share"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "nextcloud.png"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=nextcloud"
  tls:
    - secretName: nextcloud-tls
      hosts:
        - cloud.jardoole.xyz

# Cron job for background tasks (sidecar mode)
cronjob:
  enabled: true

# Liveness/readiness probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 3

# Metrics for Prometheus (optional)
metrics:
  enabled: false
