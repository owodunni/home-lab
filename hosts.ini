[servers]
pi-cm5-1
pi-cm5-2
pi-cm5-3

[desktop]
pi-cm5-4

[storage]
beelink ansible_host=192.168.2.5
valen ansible_host=192.168.1.197

[wireguard]
beelink ansible_host=192.168.2.5

[ingress]
beelink ansible_host=192.168.2.5
pi-cm5-1
# Co-located with Seafile: each app host terminates its own TLS, so the
# service port stays on loopback and the host can carry a tight firewall.
pi-cm5-2
# Co-located with the media stack: valen runs Traefik so each media UI binds
# loopback and is proxied locally (same model as Seafile on pi-cm5-2).
valen ansible_host=192.168.1.197

[monitoring]
pi-cm5-1

[authentik]
pi-cm5-1

[garage]
beelink ansible_host=192.168.2.5

# Seafile file-sync/share. Compute runs here; bulk file data lives on valen's
# pool over NFS. Traefik is co-located (pi-cm5-2 is in [ingress]).
[seafile]
pi-cm5-2

# NFS server exporting the MergerFS storage pool. Dedicated group so the
# export can move with a one-line change, same convention as service groups.
[nfs_server]
valen ansible_host=192.168.1.197

# Media host — runs the arr stack (compute + storage + Intel iGPU transcoding all
# co-located on valen). [media] carries media-host-wide concerns (storage layout,
# GPU drivers, forward-auth middleware); each service also has its own group below
# so it can move with a one-line change.
[media]
valen ansible_host=192.168.1.197

# qBittorrent + Gluetun (ProtonVPN) + port-manager.
[qbittorrent]
valen ansible_host=192.168.1.197

# Docker fleet additions beyond the Pi [services:children] — valen runs Docker
# for the media stack. (Side effect: valen joins [nfs_client] via the children
# below and gets nfs-common; harmless, media data is local.)
[services]
valen ansible_host=192.168.1.197

[pi_cm5:children]
servers
desktop

[services:children]
servers
desktop

# NFS clients = the Docker fleet: every host that may mount the pool as a
# native Docker NFS volume. Mirrors [services] today; kept as its own group so
# it can diverge (e.g. a non-Docker host that still needs the share).
[nfs_client:children]
services
