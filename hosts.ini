[servers]
pi-cm5-1
pi-cm5-2
pi-cm5-3

[desktop]
pi-cm5-4

[storage]
beelink ansible_host=192.168.2.5
valen ansible_host=192.168.1.197

[wireguard]
beelink ansible_host=192.168.2.5

[ingress]
beelink ansible_host=192.168.2.5
pi-cm5-1
# Co-located with Nextcloud: each app host terminates its own TLS, so the
# service port stays on loopback and the host can carry a tight firewall.
pi-cm5-2
# Co-located with the media stack: valen runs Traefik so each media UI binds
# loopback and is proxied locally (same model as Nextcloud on pi-cm5-2).
valen ansible_host=192.168.1.197

[monitoring]
pi-cm5-1

[authentik]
pi-cm5-1

# AdGuard Home — the home network's filtering DNS resolver (ads/porn/social) and
# the Ubiquiti router's single upstream. On pi-cm5-3 (the only free [servers] Pi:
# always-on, on the home LAN, covered by host-resilience). One-line move.
[adguard]
pi-cm5-3

# Garage S3 object storage. Runs on valen (local to the bulk of the data and on
# the home LAN), so every service backs up to a LOCAL S3 target instead of
# crawling over WireGuard to the offsite node. The offsite copy is made by the
# [backup_mirror] node pulling from here — see playbooks/backup-mirror.yml and
# CLAUDE.md "Backups: 3-2-1". valen is in [ingress], so it routes s3.jardoole.xyz.
[garage]
valen ansible_host=192.168.1.197

# Offsite backup mirror. beelink pulls every Garage bucket from valen into plain
# restic-repo files on its own pool, using a READ-ONLY key — so a compromised
# valen has no path to reach it and a compromised beelink cannot alter valen's
# copy. This is the decoupled "something else backs up offsite": the app
# sidecars only ever write locally to valen; this node makes the offsite copy.
[backup_mirror]
beelink ansible_host=192.168.2.5

# Nextcloud file-sync/share. Compute runs here; bulk file data lives on valen's
# pool over NFS. Traefik is co-located (pi-cm5-2 is in [ingress]).
[nextcloud]
pi-cm5-2

# Vaultwarden password manager. Compute + Postgres + data all local on the Pi,
# behind the co-located Traefik (pi-cm5-2 is in [ingress]). One-line move.
[vaultwarden]
pi-cm5-2

# NFS server exporting the MergerFS storage pool. Dedicated group so the
# export can move with a one-line change, same convention as service groups.
[nfs_server]
valen ansible_host=192.168.1.197

# Media host — runs the arr stack (compute + storage + Intel iGPU transcoding all
# co-located on valen). [media] carries media-host-wide concerns (storage layout,
# GPU drivers, forward-auth middleware); each service also has its own group below
# so it can move with a one-line change.
[media]
valen ansible_host=192.168.1.197

# qBittorrent + Gluetun (ProtonVPN) + port-manager.
[qbittorrent]
valen ansible_host=192.168.1.197

# Prowlarr indexer/tracker manager (feeds indexers to Radarr/Sonarr).
[prowlarr]
valen ansible_host=192.168.1.197

# Radarr movie collection manager.
[radarr]
valen ansible_host=192.168.1.197

# Sonarr TV series manager.
[sonarr]
valen ansible_host=192.168.1.197

# Unpackerr — extracts archived (RAR/ZIP/7z) downloads so Radarr/Sonarr can
# import them. Serves both *arr apps over the shared media network.
[unpackerr]
valen ansible_host=192.168.1.197

# Jellyfin media server (Intel QuickSync transcoding via valen's iGPU).
[jellyfin]
valen ansible_host=192.168.1.197

# Jellyseerr media request/discovery UI (top of the media stack).
[jellyseerr]
valen ansible_host=192.168.1.197

# Jellyfin barn relay — runs on beelink (already an [ingress] host with its own
# ACME wildcard cert), reverse-proxying jellyfin.jardoole.xyz over the existing
# WireGuard tunnel so a device on beelink's local barn network can reach
# Jellyfin. See docs/superpowers/specs/2026-07-18-jellyfin-barn-relay-design.md.
[jellyfin_relay]
beelink ansible_host=192.168.2.5

# Docker fleet additions beyond the Pi [services:children] — valen runs Docker
# for the media stack. (Side effect: valen joins [nfs_client] via the children
# below and gets nfs-common; harmless, media data is local.)
[services]
valen ansible_host=192.168.1.197

[pi_cm5:children]
servers
desktop

[services:children]
servers
desktop

# NFS clients = the Docker fleet: every host that may mount the pool as a
# native Docker NFS volume. Mirrors [services] today; kept as its own group so
# it can diverge (e.g. a non-Docker host that still needs the share).
[nfs_client:children]
services
