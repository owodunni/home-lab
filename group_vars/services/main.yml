---
# Variables for hosts in the [services] group

# geerlingguy.docker role overrides
# docker_edition defaults to 'ce' in the role — not repeated here
docker_install_compose: true

# Pin the Docker embedded DNS resolver's upstreams (written to
# /etc/docker/daemon.json by the geerlingguy.docker role, which restarts the
# daemon on change).
# What: Give dockerd's embedded resolver (127.0.0.11, used by every container on
#       a user-defined network) a fixed upstream list instead of whatever it
#       infers from the host's /etc/resolv.conf at daemon-start time.
# Why:  At boot, dockerd starts and launches containers before dhcpcd has
#       finished writing the real `nameserver 192.168.1.1` into
#       /etc/resolv.conf. The embedded resolver captured that transient
#       loopback-only/empty state as its upstream, so containers could resolve
#       each other's names but every EXTERNAL lookup dead-ended with
#       getaddrinfo EAI_AGAIN — for the life of the running container. Setting an
#       explicit list removes the boot-time race entirely (the resolver no longer
#       reads resolv.conf for upstreams). Router first so any LAN-local names
#       still resolve; Cloudflare 1.1.1.1 as a fallback so a router DNS hiccup
#       does not blind every container (all *.jardoole.xyz names are public
#       Cloudflare records, so the fallback resolves them too).
# Resolves: Jellyseerr (and every other container on valen) losing all external
#           DNS after a host reboot until Docker was restarted.
docker_daemon_options:
  dns:
    - "192.168.1.1"
    - "1.1.1.1"

# ============================================================================
# cAdvisor (per-container metrics exporter)
# What: Image/port for the cAdvisor container deployed on every [services] host
#       by playbooks/cadvisor.yml (roles/cadvisor). The matching scrape targets,
#       alert rules, and Grafana dashboard live in group_vars/monitoring/main.yml.
# Why:  cAdvisor is the per-container counterpart to node_exporter — it attributes
#       CPU/memory/network/disk to individual containers so service placement
#       across the Pis can be reasoned about with data.
# Resolves: These deploy-time values live with the targeted [services] group
#           (not the role) per the no-role-defaults rule in CLAUDE.md.
# ============================================================================
cadvisor_dir: /opt/cadvisor
cadvisor_image: gcr.io/cadvisor/cadvisor
# v0.55.1 is the newest tag actually published to gcr.io/cadvisor — the project
# stopped mirroring releases there after it (GitHub has up to v0.60.1, but those
# tags 404 on this registry). Multi-arch: amd64 (valen) + arm64 (Pi CM5).
cadvisor_version: v0.55.1
# Host port for cAdvisor's metrics. 9101 (mnemonic neighbour of node_exporter's
# 9100), NOT cAdvisor's default 8080 — Traefik's dashboard and qBittorrent
# already bind 8080 on some fleet hosts. Keep in sync with monitoring_cadvisor_targets.
cadvisor_port: 9101

# ============================================================================
# Host firewall — cAdvisor rule (docs/superpowers/specs/2026-07-19-host-firewalls-design.md)
# ============================================================================
# What: Allows Prometheus (pi-cm5-1) to reach cAdvisor's published port.
# Why:  scope: docker, not host — cAdvisor is published as
#       "{{ cadvisor_port }}:8080" with no bind address, so Docker publishes it
#       to 0.0.0.0 and routes it through Docker's own iptables FORWARD chains
#       (DOCKER-USER), bypassing ufw's INPUT chain entirely. A ufw INPUT rule
#       (or deny) has no effect on this port; the firewall role templates
#       scope: docker rules into DOCKER-USER instead.
# Resolves: cAdvisor being reachable from the whole homelab_subnet with no
#           host firewall able to restrict it, if it were (wrongly) declared
#           scope: host.
firewall_rules_cadvisor:
  - name: cadvisor
    port: "{{ cadvisor_port }}"
    proto: tcp
    from: [monitoring_host]
    scope: docker
    comment: "Per-container metrics scrape (Docker-published port, bypasses ufw INPUT)"
