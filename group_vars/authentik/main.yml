---
# Authentik service configuration
# Secrets (vault_authentik_pg_pass, vault_authentik_secret_key) live in vault.yml.

# Pin to a specific release. Releases: https://github.com/goauthentik/authentik/releases
#
# UPGRADING: Authentik forbids skipping major releases — each major's DB
# migrations must run in order. Step through every intermediate major (latest
# patch of each), backing up the DB and re-running the auth layer at each step,
# and verify the stack is healthy before advancing. Check each release's notes
# for breaking changes that need compose/config edits before bumping.
authentik_version: "2026.5.3"

# Directory on the target host where the docker-compose stack and persistent
# data subdirs (media, certs, custom-templates) are stored.
authentik_dir: /opt/authentik

# Port the Authentik server container binds on the host.
# Traefik routes auth.{{ traefik_domain }} → 127.0.0.1:{{ authentik_port }}.
authentik_port: 9000

# ============================================================================
# Database backup — pg_dump → restic → Garage S3
#
# WHAT: a postgres:16 `pg-dump` sidecar writes a logical dump of the DB to a
#   shared volume on a schedule; a lobaro restic `db-backup` sidecar snapshots
#   that volume to Garage S3.
# WHY: the database needs the SAME grandfather-father-son retention the file
#   volumes already get (keep yearly/monthly/weekly/daily restore points), plus
#   per-snapshot restore so an OLD good state survives long after corruption.
#   The previous eeshugerman/postgres-backup-s3 sidecar could only do a flat
#   "delete dumps older than N days" — after that window the good dump was gone,
#   with no way back. restic gives true GFS retention + restore-any-snapshot,
#   and unifies both backups (DB + volumes) under one retention engine and one
#   list/verify/restore code path.
# RESOLVES: "wait 7 days after things go bad and there's no good state to
#   recover" — restic now keeps weekly/monthly/yearly points well past 7 days.
#
# Bucket and API key are provisioned by the first play in playbooks/authentik.yml
# (which targets the [garage] host) — but you bring the credentials: generate a
# Garage-format key pair with `scripts/garage-keygen.sh`, then vault both halves
# into group_vars/authentik/vault.yml as vault_authentik_backup_s3_access_key and
# vault_authentik_backup_s3_secret_key before running the auth layer. The play
# imports them into Garage; nothing is printed back. Fully unattended thereafter.
# ============================================================================

# How often the pg-dump sidecar refreshes the on-disk dump (seconds). It dumps
# once on start, then on this interval; the db-backup sidecar snapshots whatever
# dump is present at its own cron time below. 86400 = daily.
authentik_db_dump_interval_seconds: 86400

# Cron expression (5-field crond syntax) for the restic db-backup snapshot run.
# Offset from the volumes-backup run (0 3) so the two restic jobs don't compete
# for upload bandwidth.
authentik_db_backup_schedule: "0 2 * * *"

# Passed to `restic forget` after each db snapshot. GFS policy: a week of
# dailies, a month of weeklies, a third of a year of monthlies, and one yearly,
# then prune unreferenced data. Identical to the volumes policy below so both
# backups age out the same way.
authentik_db_backup_retention_args: "--keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 1 --prune"

# Garage S3 — region label must match garage_s3_region in group_vars/ingress/main.yml.
# Bucket is created by the garage layer; key credentials go in vault.yml. The DB
# restic repo lives under the `restic/` subpath of this bucket (see compose), so
# it stays clear of any leftover objects from the old pg-backup sidecar.
authentik_backup_s3_region: "garage"
authentik_backup_s3_bucket: "authentik-backup"

# Garage exposes its S3 API at s3.jardoole.xyz via Traefik on beelink.
# Path-style requests (aws cli default for custom endpoints) are supported.
authentik_backup_s3_endpoint: "https://s3.jardoole.xyz"

# ============================================================================
# File-volume backup — lobaro/restic-backup-docker sidecar → Garage S3
#
# The db-backup above only covers the Postgres dump. media/, certs/, and
# custom-templates/ are bind-mounted directories that live outside Postgres
# (uploaded assets, imported certs, custom templates) and need their own
# backup. The Postgres data dir is intentionally excluded: a raw copy of a
# live Postgres data dir would be crash-inconsistent (the pg-dump sidecar's
# logical dump is the correct way to capture that).
#
# Vault vars required (group_vars/authentik/vault.yml):
#   vault_authentik_volumes_backup_s3_access_key / _secret_key — separate
#     bucket+key from the DB backup ones above, so retention/lifecycle can
#     differ. Generate with:
#       scripts/garage-keygen.sh vault_authentik_volumes_backup_s3
#   vault_authentik_restic_password — encrypts BOTH restic repos (the DB repo
#     and this volumes repo share one password; each repo is still a separate
#     bucket/path). Generate with:
#       openssl rand -base64 32
#     LOSING THIS PASSWORD MAKES ALL EXISTING SNAPSHOTS UNRECOVERABLE — restic
#     cannot decrypt the repo without it. Store a copy outside this repo
#     (e.g. password manager) before the first run.
# ============================================================================

# Image tag — multi-arch (amd64/arm64/arm-v7), matches the Pi CM5 hosts.
# Releases: https://github.com/lobaro/restic-backup-docker/releases
authentik_volumes_backup_image_version: "v1.4.2"

# Cron expression (5-field crond syntax — lobaro's entrypoint feeds this
# straight to crond). Offset by an hour from the db-backup run (0 2) so the two
# restic jobs don't compete for upload bandwidth at the same time.
authentik_volumes_backup_schedule: "0 3 * * *"

# Passed to `restic forget` after each backup run. GFS policy (kept identical to
# the DB policy above): a week of dailies, a month of weeklies, a third of a
# year of monthlies, and one yearly, then prune data no longer referenced by any
# kept snapshot (restic dedupes content across snapshots, so prune is what
# actually reclaims space for changed/deleted files).
authentik_volumes_backup_retention_args: "--keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 1 --prune"

# Separate bucket from authentik_backup_s3_bucket (the DB restic repo) so the two
# backups have independent buckets/keys.
authentik_volumes_backup_s3_bucket: "authentik-volumes-backup"

# ============================================================================
# Backup manifest — consumed by the generic verify/restore tooling
# (roles/backup_verify, roles/backup_restore; playbooks verify-backups.yml and
# restore-backups.yml). See CLAUDE.md → "Backups: verify & restore".
#
# WHAT: declares every backup this service produces, one entry per backup, each
#   tagged with a `type` (engine). The tooling loops this list and dispatches
#   each entry to the matching per-type handler (tasks/<type>.yml in the roles).
# WHY: the verify/restore *method* is a property of the engine (postgres dump vs
#   restic snapshot), but *which* backups a service has is a property of the
#   service. Keeping the manifest here lets one generic playbook handle any
#   service: `make verify-backups SERVICE=authentik`. Migrating Authentik to a
#   new host carries this manifest with it — no playbook edits.
# RESOLVES: backups that silently rot. Freshness is now an asserted, runnable
#   check instead of a manual step in a doc.
#
# max_age_hours: a backup older than this fails verification. Set a little above
#   the schedule interval so a normal run never trips it but a missed run does.
# ============================================================================
# Compose project dir the restore playbook stops/starts as a whole. All backup
# entries below live in this same stack.
backup_compose_dir: "{{ authentik_dir }}"

backup_consumer_services:
  # Compose services that read the DB / file volumes. The restore playbook stops
  # these before restoring (so nothing writes mid-restore) and starts the whole
  # stack again afterwards.
  - server
  - worker

backups:
  - name: postgres
    # type: postgres — a pg_dump captured in a restic repo. Verify is restic
    # snapshot-freshness (handler delegates to the restic verifier); restore is
    # restic-restore-the-chosen-snapshot then pg_restore into the live DB.
    type: postgres
    compose_dir: "{{ authentik_dir }}"
    # The restic sidecar that holds the DB snapshots (list/verify/restic-restore
    # run through it).
    compose_service: db-backup
    # The postgres-client sidecar used to run pg_restore against the live DB.
    pg_restore_service: pg-dump
    bucket: "{{ authentik_backup_s3_bucket }}"
    schedule: "{{ authentik_db_backup_schedule }}"   # 0 2 * * *
    # Filename of the dump inside each snapshot (restic restores it to
    # /restore/data/<dump_file>). Matches what the pg-dump sidecar writes.
    dump_file: authentik.dump
    # Slack over the snapshot cron: the dump on disk can lag the snapshot by up
    # to one dump interval, so allow a little more than the volumes window.
    max_age_hours: 30

  - name: volumes
    type: restic
    compose_dir: "{{ authentik_dir }}"
    compose_service: volumes-backup
    bucket: "{{ authentik_volumes_backup_s3_bucket }}"
    schedule: "{{ authentik_volumes_backup_schedule }}"   # 0 3 * * *
    max_age_hours: 27
    # Paths (relative to compose_dir) the restic restore copies back over.
    restore_paths:
      - media
      - certs
      - custom-templates
