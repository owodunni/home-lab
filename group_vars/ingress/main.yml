---
# Variables for all hosts in the [ingress] group
# (bare-metal hosts running Traefik + application services)

# ============================================================================
# Traefik
# ============================================================================
traefik_version: "3.7.4"

# Public domain (traefik_domain) moved to group_vars/all/main.yml: it is a
# lab-global constant (monitoring URLs, blackbox targets, OIDC, and Alloy's Loki
# push URL on every host all consume it), not Traefik-specific. Traefik still
# issues the wildcard cert for *.{{ traefik_domain }} using it from there.

# Email registered with Let's Encrypt for expiry notifications
letsencrypt_email: "alex.o.poole@gmail.com"

# IPs whose X-Forwarded-* headers Traefik trusts on the websecure entrypoint.
# What:  CIDRs Traefik will preserve (not scrub) forwarded headers from.
# Why:   A co-located app Traefik (valen) forwards its Authentik forward-auth
#        check to the Authentik host's Traefik (pi-cm5-1) at auth.jardoole.xyz,
#        passing X-Forwarded-Host: <app>.jardoole.xyz. Without trusting the
#        forwarder, the receiving entrypoint sanitizes that header to
#        auth.jardoole.xyz, so the outpost builds the post-login redirect (rd)
#        for the auth host and the user lands on the Authentik dashboard instead
#        of the app. Trusting the LAN lets the real origin host survive the hop.
# Resolves: domain-level forward auth dumping signed-in users on the Authentik
#           "My Applications" dashboard rather than returning them to the app.
traefik_forwarded_trusted_ips:
  - "127.0.0.1/32"
  - "192.168.1.0/24"

# Cloudflare API token (DNS:Edit permission for jardoole.xyz) — from vault
cloudflare_api_token: "{{ vault_cloudflare_api_token }}"

# ============================================================================
# Garage
# ============================================================================
garage_version: "2.3.0"

# S3 region label (arbitrary; clients must match this when configuring buckets)
garage_s3_region: "garage"

# Ports — all bound to localhost; Traefik terminates TLS and proxies inbound
garage_s3_api_port: 3900
garage_rpc_port: 3901
garage_s3_web_port: 3902
garage_admin_port: 3903

# Absolute path to the Garage config template; role requires this but has no default
garage_local_template: "{{ playbook_dir }}/templates/garage.toml.j2"

# ============================================================================
# Host firewall — ingress rules (docs/superpowers/specs/2026-07-19-host-firewalls-design.md)
# ============================================================================
# What: Traefik's two public entrypoints — 80 (ACME HTTP-01/redirect) and 443
#       (every routed service).
# Why 443's source list is broad: it is every service front door on the LAN
#       for LAN clients, VLAN-10 trusted devices + TV, Alloy pushing logs to
#       Loki (loki.jardoole.xyz), beelink's rclone offsite backup pull
#       (s3.jardoole.xyz — see CLAUDE.md Backups section), and the blackbox
#       exporter's HTTP probes. barn_lan is included so beelink's own Jellyfin
#       TV relay clients on the barn WiFi (numerically = homelab_subnet, see
#       the barn_lan alias comment in group_vars/all/main.yml) can still reach
#       443 on beelink's co-located Traefik.
# Why 80 is narrower: ACME HTTP-01 challenges and the plain-HTTP→HTTPS
#       redirect don't need barn_lan — no barn client hits port 80 directly.
# Resolves: the default-deny baseline would otherwise block every browser,
#           TV, and automated client from reaching any service.
#
# Deliberately ABSENT from this list (do not add without updating the design
# spec's "Known Docker-published ports" section first):
#   - Traefik's :8080 insecure dashboard — operator confirmed unused; the
#     firewall closes it rather than relying on it never being enabled.
#   - Garage RPC :3901 — inter-node S3 protocol, no external client needs it.
#   - Loki gRPC :9096 — internal Loki API, not the push route (443 covers
#     the actual ingest path via Traefik).
firewall_rules_ingress:
  - name: traefik-https
    port: 443
    proto: tcp
    from: [homelab_subnet, home_vlan, vpn_subnet, barn_lan]
    scope: host
    comment: "Every service front door: LAN, VLAN-10 trusted devices + TV, Alloy->Loki push, beelink rclone backup pull, blackbox probes"
  - name: traefik-http
    port: 80
    proto: tcp
    from: [homelab_subnet, home_vlan, vpn_subnet, barn_lan]
    scope: host
    comment: "ACME HTTP-01 challenge + HTTP->HTTPS redirect only"
