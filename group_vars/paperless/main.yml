---
# Paperless-ngx document management service configuration
# Secrets (vault_paperless_pg_pass, vault_paperless_secret_key, etc.) live in vault.yml.
#
# What: Configuration variables for Paperless-ngx (webserver, Postgres 16, Redis,
#       and restic backup sidecars).
# Why:  Single source of truth for all non-secret settings consumed by the
#       Paperless role and playbooks, following the repo's group_vars convention.
# Resolves: Declarative configuration of Paperless-ngx with no hardcoding in the role.

# Pin to a specific release. Releases: https://github.com/paperless-ngx/paperless-ngx/releases
# What: Bump Paperless from 2.14.7 to 3.3.0.
# Why:  Cornerstone's Paperless integration requires API v10, which 2.14.7 does
#       not expose.
# Resolves: Cornerstone document integration failing against the old API.
paperless_version: "3.3.0"

# Directory on the target host (pi-cm5-2) where docker-compose stack and
# persistent data subdirs are stored.
paperless_dir: /opt/paperless

# Persistent paths under the stack directory.
# media/ is the host NFS mount point pointing to valen's storage pool.
# data/ (search index & ML models) remains local on the host SSD/eMMC.
paperless_media_dir: "{{ paperless_dir }}/media"
paperless_data_dir: "{{ paperless_dir }}/data"
paperless_consume_dir: "{{ paperless_dir }}/consume"
paperless_export_dir: "{{ paperless_dir }}/export"

# Host port the webserver container binds on loopback.
# Traefik routes paperless.{{ traefik_domain }} → 127.0.0.1:{{ paperless_port }}.
paperless_port: 8003
paperless_hostname: "paperless.{{ traefik_domain }}"

# Container process UID/GID (paperless user in container defaults to 1000:1000).
paperless_container_uid: 1000
paperless_container_gid: 1000

# ============================================================================
# Storage / NFS configuration
#
# What: Host NFSv3 mount for bulk document media on valen's MergerFS pool.
# Why:  Paperless documents (original PDFs, OCR archives, thumbnails) grow
#       continuously. Storing them on valen's pool protects them with SnapRAID
#       parity and avoids filling the Pi's local storage. Search indexes (data/)
#       remain local to avoid SQLite/Tantivy lock degradation over NFS.
# Resolves: High-capacity, parity-protected document storage for Paperless.
# ============================================================================
paperless_nfs_addr: "{{ hostvars[groups['nfs_server'][0]]['ansible_host'] }}"
paperless_nfs_subdir: "paperless/media"
# Absolute path of that directory on the NFS server (valen). Must equal valen's
# mergerfs_mount_point (/mnt/storage). Set explicitly here because pi-cm5-2 is
# not in [storage] and does not hold mergerfs_mount_point in its host vars.
paperless_nfs_server_path: "/mnt/storage/{{ paperless_nfs_subdir }}"
paperless_nfs_version: 3

# ============================================================================
# Application settings
# ============================================================================
paperless_timezone: "UTC"

# What: Tesseract runs the Swedish model first, then English (`swe+eng`); the
#       pack list is what actually gets installed in the container.
# Why:  The archive is mostly Swedish invoices/documents with some English.
#       OCR quality is the single biggest driver of downstream AI quality, so
#       the Swedish model must be present and primary. German is retained
#       because it was already installed and only loads on a matching doc.
# Resolves: Swedish documents being OCR'd as garbage before AI ever sees them.
paperless_ocr_language: "swe+eng"
paperless_ocr_languages: "swe eng deu"

# Traefik terminates TLS and forwards to the app over loopback; docker bridges
# handle container communication.
paperless_trusted_proxies: "127.0.0.1,172.16.0.0/12,192.168.1.0/24"

# ============================================================================
# Database — names only; credentials are vaulted (vault_paperless_pg_pass)
# ============================================================================
paperless_db_host: "db"
paperless_db_name: "paperless"
paperless_db_user: "paperless"

# ============================================================================
# SSO — native OIDC against Authentik via django-allauth
#
# What: Integrates Paperless-ngx with Authentik using django-allauth openid_connect.
# Why:  Provides seamless SSO login while preserving API and native app access.
# Resolves: Centralized identity management for Paperless-ngx.
# ============================================================================
paperless_oidc_enabled: true
paperless_oidc_client_id: "paperless"
paperless_oidc_provider_id: "authentik"
paperless_oidc_discovery_uri: "https://auth.{{ traefik_domain }}/application/o/paperless/.well-known/openid-configuration"
paperless_oidc_logout_redirect_url: "https://auth.{{ traefik_domain }}/application/o/paperless/end-session/"

# ============================================================================
# AI — LLM + embeddings via OpenRouter
#
# What: Enables Paperless' AI suggestions (title/tags/correspondent/type) and
#       RAG retrieval over the archive, using OpenRouter's OpenAI-compatible
#       chat and embeddings APIs with the shared vault_openrouter_api_key.
# Why:  OpenRouter exposes both a chat-completions API and a separate
#       embeddings catalog, so no local Ollama/sentence-transformers service
#       is needed. gpt-6-luna is the cheap JSON-capable chat model Cornerstone
#       also uses; bge-m3 is a paid multilingual (SV/EN) embedder.
# Resolves: AI features off by default — no provider configured.
# Design: docs/superpowers/specs/2026-10-12-paperless-cornerstone-ai-design.md
# ============================================================================
paperless_ai_enabled: true
paperless_ai_llm_backend: "openai-like"
paperless_ai_llm_model: "openai/gpt-6-luna"
paperless_ai_llm_endpoint: "https://openrouter.ai/api/v1"
# Swedish archive → suggestions come back in Swedish, independent of the
# logged-in user's UI language.
paperless_ai_llm_output_language: "swe"
# OpenRouter routing can exceed the 120s default; 180s gives headroom.
paperless_ai_llm_request_timeout: 180
# Routing guard: only use upstream providers that do not collect request data.
paperless_ai_llm_extra_params: '{"provider":{"data_collection":"deny"}}'
# bge-m3 accepts up to 8194 tokens; 1024-token chunks leave margin.
paperless_ai_embedding_backend: "openai-like"
paperless_ai_embedding_model: "baai/bge-m3"
paperless_ai_embedding_endpoint: "https://openrouter.ai/api/v1"
paperless_ai_embedding_chunk_size: 1024

# ============================================================================
# Database backup — pg_dump → restic → Garage S3
#
# What: postgres:16 `pg-dump` sidecar produces a logical dump on schedule;
#       lobaro restic `db-backup` sidecar snapshots that dump to Garage S3.
# Why:  Gives the database grandfather-father-son retention and point-in-time
#       restoration, unified under the platform's backup verify/restore engine.
# Resolves: Safe, verified database backups for Paperless.
# ============================================================================
paperless_db_dump_interval_seconds: 86400
paperless_db_backup_schedule: "0 2 * * *"
paperless_db_backup_retention_args: "--keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 1 --prune"
paperless_backup_s3_region: "garage"
paperless_backup_s3_bucket: "paperless-backup"
paperless_backup_s3_endpoint: "https://s3.jardoole.xyz"

# ============================================================================
# Media & data backup — lobaro/restic-backup-docker sidecar → Garage S3
#
# What: A restic sidecar snapshots both the NFS media mount and local data dir
#       (read-only) to its own Garage bucket.
# Why:  Ensures full document archive recovery independent of the database dump.
# Resolves: Comprehensive backup of all Paperless documents and indexes.
# ============================================================================
paperless_backup_image_version: "v1.4.2"
paperless_media_backup_schedule: "0 4 * * *"
paperless_media_backup_retention_args: "--keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 1 --prune"
paperless_media_backup_s3_bucket: "paperless-media-backup"

# ============================================================================
# Backup manifest — consumed by roles/backup_verify and roles/backup_restore
# ============================================================================
backup_compose_dir: "{{ paperless_dir }}"
backup_consumer_services:
  - webserver

backups:
  - name: postgres
    type: postgres
    compose_dir: "{{ paperless_dir }}"
    compose_service: db-backup
    pg_restore_service: pg-dump
    bucket: "{{ paperless_backup_s3_bucket }}"
    schedule: "{{ paperless_db_backup_schedule }}"
    dump_file: paperless.dump
    max_age_hours: 30

  - name: media
    type: restic
    compose_dir: "{{ paperless_dir }}"
    compose_service: media-backup
    bucket: "{{ paperless_media_backup_s3_bucket }}"
    schedule: "{{ paperless_media_backup_schedule }}"
    max_age_hours: 27
    restore_paths:
      - media
      - data
