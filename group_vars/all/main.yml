---
# Common variables available to all hosts
# Variables defined here can be overridden in more specific group_vars

# Privilege Escalation (sudo)
# ===========================
# What: Become password for the cluster admin user, sourced from vault.
# Why: The Pis require a password for sudo, so playbooks using
#      `become: true` (e.g. upgrade.yml) need a become password to run.
# Resolves: "Missing sudo password" failures during privilege escalation
#           when running playbooks non-interactively (no --ask-become-pass).
ansible_become_password: "{{ vault_become_password }}"

# SMTP Configuration (Gmail Relay)
# =================================
# Cluster-wide email settings for alerts and notifications.
# Uses Gmail SMTP with a custom "From" address (alert@jardoole.xyz).
# See docs/email-configuration.md for setup instructions.
smtp_host: "smtp.gmail.com"
smtp_port: 587
smtp_use_tls: true
smtp_use_ssl: false
smtp_from: "alert@jardoole.xyz"

# Network
# =======
# The home LAN CIDR. Kept as a single variable so renumbering the LAN (or
# moving the lab to a different subnet) is a one-line change here instead of
# editing every consumer. Used by playbooks/nfs.yml to scope the storage
# export to LAN clients. Hosts are referenced by DNS name elsewhere (e.g.
# `valen`), so only ACLs that genuinely need a CIDR live here.
home_lan_subnet: "192.168.1.0/24"

# ============================================================================
# Host firewall — source aliases, policy knobs, and the baseline rule set
# (docs/superpowers/specs/2026-07-19-host-firewalls-design.md)
# ============================================================================
# What: Named CIDR sources so firewall_rules_* entries read semantically
#       (`from: [monitoring_host]`) instead of repeating raw CIDRs. The
#       firewall role resolves aliases (and passes through literal CIDRs)
#       when applying rules.
# Why:  Router zones (see network-zone-segmentation spec) gate who gets INTO
#       the homelab, but do nothing about a compromised host reaching every
#       port on every other homelab host. Per-service, source-restricted host
#       rules are the only control on that lateral movement.
# Resolves: no host-level defense-in-depth; the router is the only gate.
firewall_source_aliases:
  # Wired homelab servers + router. Reused rather than duplicated so
  # renumbering the LAN stays a one-line change.
  homelab_subnet: "{{ home_lan_subnet }}"
  # UniFi VLAN 10 — personal devices, TV, IoT. The router's zone policy
  # already gates which of these devices reach the homelab at all; host
  # rules accept the whole VLAN and leave per-device trust to the router
  # rather than re-implementing that policy here.
  home_vlan: "192.168.10.0/24"
  # UniFi WireGuard subnet — beelink (192.168.2.5) and road-warrior clients.
  # Matches wg_allowed_ips in host_vars/beelink/main.yml.
  vpn_subnet: "192.168.2.0/24"
  # beelink's local barn WiFi. Numerically identical to homelab_subnet
  # because the two subnets collide (see
  # docs/superpowers/specs/2026-07-18-jellyfin-barn-relay-design.md) — kept
  # as a separate alias so rules on beelink state intent (barn-local traffic)
  # rather than reading as a same-CIDR duplicate of homelab_subnet.
  barn_lan: "192.168.1.0/24"
  # pi-cm5-1 — the sole Prometheus scraper. Every exporter rule restricts to
  # just this host instead of the whole homelab_subnet.
  monitoring_host: "192.168.1.19"
  # valen — source of NFSv3 lock/status callbacks to clients (see
  # firewall_rules_nextcloud_nfs_client in group_vars/nextcloud/main.yml).
  nfs_server_host: "192.168.1.197"

# ufw logging verbosity. "low" logs blocked/allowed packets without the
# per-packet volume of "medium"/"high" — enough for Alloy to ship drops to
# Loki (see CLAUDE.md monitoring layer) without flooding journald.
firewall_logging: "low"

# Minutes the firewall-rollback timer waits before running `ufw disable` if
# Ansible never reconnects after enabling ufw. Why: beelink is a 1.5h drive
# away (see project_beelink_offsite_topology memory) — a bad rule that locks
# out SSH must self-heal, not require a physical visit. Cancelled by the
# role's own post-enable reconnect task on a normal run.
firewall_rollback_minutes: 10

# Baseline rules applied to every host (hosts: all, no [firewall] group —
# see design spec "Play target"). Per-service rules live in each service's
# own group_vars/<service>/main.yml as firewall_rules_<service>.
firewall_rules_base:
  - name: ssh
    port: 22
    proto: tcp
    # homelab_subnet, home_vlan, vpn_subnet: admin + Ansible control access
    # from every trusted network. On beelink the homelab_subnet CIDR also
    # numerically matches the colliding barn LAN (see barn_lan above) — that
    # overlap is deliberate: it is the only local recovery path when the
    # WireGuard tunnel is down, short of the 1.5h drive to the barn, and SSH
    # stays key-only auth so the exposure to untrusted barn neighbors is
    # accepted (see design spec "Risks & accepted trade-offs").
    from: [homelab_subnet, home_vlan, vpn_subnet]
    scope: host
    comment: "Admin + Ansible control access (key-only auth)"

# node_exporter lives in `all` (not a per-service file) because
# node-exporter.yml targets hosts: all — every host in the fleet runs it.
firewall_rules_node_exporter:
  - name: node-exporter
    port: 9100
    proto: tcp
    from: [monitoring_host]
    scope: host
    comment: "Prometheus host metrics scrape (pi-cm5-1 only)"

# Public domain for the lab. Every service is <name>.jardoole.xyz behind the
# wildcard cert. Lives here (not group_vars/ingress) because it is consumed
# lab-wide — monitoring URLs, blackbox targets, Grafana/Authentik OIDC, and
# Alloy's Loki push URL on hosts that are NOT in [ingress] (pi-cm5-3/4).
traefik_domain: "jardoole.xyz"

# Unattended Upgrades
# ===================
# Fleet-wide automatic-update policy consumed by playbooks/unattended-upgrades.yml.

# Trusted update sources - security updates prioritized
unattended_origins_patterns:
  - 'origin=Debian,codename=${distro_codename},label=Debian-Security'
  - 'origin=Debian,codename=${distro_codename},label=Debian'
  - 'origin=Raspbian,codename=${distro_codename},label=Raspbian'

# Packages to exclude from automatic updates
unattended_package_blacklist: []

# Automatic reboot after updates requiring restart
unattended_automatic_reboot: true
unattended_automatic_reboot_time: "02:00"

# Clean up unused packages automatically
unattended_remove_unused_dependencies: true
unattended_remove_new_unused_dependencies: true

# Don't install during shutdown to keep shutdown times fast
unattended_install_on_shutdown: false

# Local backup freshness exporter
# ===============================
# Shared config for roles/backup_freshness (deployed by playbooks/backup-freshness.yml
# on every backup-bearing service host). The exporter reports each backup's
# newest-snapshot age so a LOCAL backup going stale on valen pages via the
# BackupLocalStale alert, instead of only being caught by a manual
# `make verify-backups`. Per-service manifest + compose dir stay in
# group_vars/<service>/main.yml.

# node_exporter's textfile collector dir (its role default); the .prom files the
# exporter writes are read from here.
backup_freshness_textfile_dir: /var/lib/node_exporter

# How often to re-probe snapshot age. Hourly (at :25, offset from the backup
# crons and the 06:00 mirror) keeps the metric fresh enough to detect a missed
# daily backup well inside its max_age_hours window, while only listing
# snapshots — a cheap, read-only op.
backup_freshness_schedule: "*-*-* *:25:00"

# Grafana Alloy — fleet log shipper
# =================================
# What: Alloy on every host (deployed by playbooks/alloy.yml, the log-side twin
#       of node_exporter) tails host journald everywhere and Docker container
#       logs where a Docker socket exists, pushing both to Loki on the monitoring
#       host. Loki stores them in Garage S3 (see group_vars/monitoring).
# Why:  Metrics see a container down; only logs saw Jellyseerr's container stay
#       Up while every DNS lookup failed. Alloy is how those logs reach Loki.
# Resolves: no central log collection + no way to alert on fatal log patterns.

# verify/bump against grafana/alloy releases before deploy (role builds the
# download URL as v{{ alloy_version }}, so "latest" does not work — must pin).
alloy_version: "1.5.1"

# Least privilege instead of running Alloy as root: systemd-journal grants read
# on the journal (every host); docker grants read on the socket, added ONLY on
# the [services] fleet where that group exists (beelink has no docker group).
alloy_user_groups: "{{ ['systemd-journal'] + (['docker'] if 'services' in group_names else []) }}"

# Basic-auth username Alloy presents to Loki's push route (paired with the
# vaulted vault_loki_push_password). Non-secret; the password + Traefik htpasswd
# hash are the secrets. See group_vars/monitoring (Traefik basic-auth middleware).
loki_push_username: "alloy"

# Alloy River config. Templated per host: the Docker block is emitted only where
# Docker runs. auth_enabled is off in Loki, so no tenant header is needed.
alloy_config: |
  // Managed by Ansible (group_vars/all/main.yml). Do not edit on the host.

  // Push sink: Loki behind Traefik at loki.<domain>, basic-auth (agents cannot
  // do the Authentik SSO flow). Split-horizon DNS resolves the hostname to the
  // monitoring host's LAN IPv4; beelink reaches it over WireGuard. Both TLS.
  // external_labels stamps every stream with this host's name.
  loki.write "default" {
    endpoint {
      url = "https://loki.{{ traefik_domain }}/loki/api/v1/push"
      basic_auth {
        username = "{{ loki_push_username }}"
        password = "{{ vault_loki_push_password }}"
      }
    }
    external_labels = {host = "{{ inventory_hostname }}"}
  }

  // Host journald: auth/sshd, systemd unit failures, unattended-upgrades, and the
  // native (non-container) Traefik/Prometheus/Grafana/Loki services.
  loki.source.journal "journal" {
    forward_to = [loki.write.default.receiver]
    labels     = {job = "journal"}
    max_age    = "12h"
  }
  {% if 'services' in group_names %}
  // Docker container logs: auto-discovers EVERY container (no per-service list),
  // so a new service is collected the moment it runs. Labelled by container name
  // and compose service. Only on the [services] fleet (hosts running Docker).
  discovery.docker "containers" {
    host = "unix:///var/run/docker.sock"
  }

  discovery.relabel "containers" {
    targets = discovery.docker.containers.targets
    rule {
      source_labels = ["__meta_docker_container_name"]
      regex         = "/(.*)"
      target_label  = "container"
    }
    rule {
      source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
      target_label  = "compose_service"
    }
  }

  loki.source.docker "containers" {
    host       = "unix:///var/run/docker.sock"
    targets    = discovery.relabel.containers.output
    forward_to = [loki.write.default.receiver]
    labels     = {job = "docker"}
  }
  {% endif %}
