---
# Cornerstone home management service configuration.
# Secrets (OIDC client secret, session secret, Paperless API token, backup S3
# key, restic password) live in group_vars/cornerstone/vault.yml with the
# vault_ prefix.
#
# What: Configuration variables for Cornerstone (home inventory, financials,
#       diary) — a Node.js app backed by SQLite, behind the co-located Traefik
#       on valen, with Authentik OIDC SSO and Paperless-ngx integration.
# Why:  Single source of truth for all non-secret settings consumed by the
#       cornerstone role and playbook, following the repo's group_vars
#       convention — no defaults inside the role.

# ============================================================================
# Image — pinned upstream tag
# ============================================================================
# Cornerstone. Releases: https://github.com/steilerdev/cornerstone/releases
# Pinned rather than :latest — upstream publishes many beta releases per day,
# and the role deploys with pull: always, so a floating tag would silently
# upgrade production on every run. 2.18.1 is the build already running on
# valen (upstream tag matches the Docker Hub tag exactly; there is no "v"
# prefix on the image). Bump deliberately, then re-run the playbook.
cornerstone_image: "steilerdev/cornerstone:2.18.1"

# ============================================================================
# Placement and routing
# ============================================================================
# Directory on valen holding the compose stack + .env. Named volumes
# (SQLite DB + photos) are stored in Docker's local volume store on valen's SSD
# — not on NFS (SQLite over NFS is unsafe; photos would fill the Pi's eMMC).
cornerstone_dir: /opt/cornerstone

# WebUI/API port. Published on 127.0.0.1 only; Traefik on valen proxies to it.
# 8004 is free on valen (valen services: immich/2283, jellyseerr/5055,
# radarr/7878, qbittorrent/8080, jellyfin/8096, sonarr/8989).
cornerstone_port: 8004

# Public hostname. Traefik terminates TLS (wildcard) and routes
# Host(cornerstone.jardoole.xyz) → 127.0.0.1:{{ cornerstone_port }}. DNS must
# resolve this name to valen.
cornerstone_hostname: "cornerstone.{{ traefik_domain }}"

# Public-facing base URL — required for OIDC callback URL construction.
# OIDC redirect URI is: {{ cornerstone_external_url }}/api/auth/oidc/callback
cornerstone_external_url: "https://{{ cornerstone_hostname }}"

# ============================================================================
# Application settings
# ============================================================================
cornerstone_log_level: "info"

# Session duration in seconds (7 days).
cornerstone_session_duration: 604800

# ============================================================================
# Logging
# ============================================================================
cornerstone_log_max_size: "20m"
cornerstone_log_max_file: "3"

# ============================================================================
# OIDC — Authentik SSO
# ============================================================================
# Issuer URL for Authentik format: https://<host>/application/o/<slug>/
# An OAuth2/OpenID Provider + Application with slug "cornerstone" must be
# created in Authentik and a client secret vaulted as vault_cornerstone_oidc_client_secret.
cornerstone_oidc_issuer: "https://auth.{{ traefik_domain }}/application/o/cornerstone/"
cornerstone_oidc_client_id: "cornerstone"
# Off by default: OIDC only links existing accounts. Enable only if the
# Authentik application is restricted to the household group.
cornerstone_oidc_jit_provisioning: false

# ============================================================================
# Paperless-ngx integration
# ============================================================================
# Internal URL Cornerstone's server uses for API calls to Paperless.
# Cornerstone (valen) and Paperless (pi-cm5-2) are on different hosts, so the
# server-side API calls go over the LAN via the HTTPS Traefik route. This is
# safe — the wildcard cert covers it and it stays on the LAN.
cornerstone_paperless_url: "https://paperless.{{ traefik_domain }}"
# Browser-accessible URL for "View in Paperless-ngx" deep links rendered in the UI.
cornerstone_paperless_external_url: "https://paperless.{{ traefik_domain }}"

# ============================================================================
# Backup — restic snapshot of /app/data (SQLite DB) → Garage S3
# ============================================================================
# WHAT: a lobaro/restic-backup-docker sidecar snapshots Cornerstone's app data
#   volume on a schedule to a dedicated Garage S3 bucket.
# WHY: /app/data holds the SQLite DB — all household inventory, financials, and
#   diary entries. A restic snapshot captures it consistently and makes it
#   restore-any-snapshot via the generic tooling.
# RESOLVES: data loss on host rebuild.
#
# Bring-your-own credentials (vaulted, generated before first run):
#   vault_cornerstone_backup_s3_access_key / _secret_key
#     scripts/garage-keygen.sh vault_cornerstone_backup_s3
#   vault_cornerstone_restic_password — openssl rand -base64 32.
#     LOSING IT MAKES EVERY EXISTING SNAPSHOT UNRECOVERABLE.

# lobaro/restic-backup-docker. Releases: https://github.com/lobaro/restic-backup-docker/releases
cornerstone_backup_image_version: "v1.4.2"

# Garage S3 endpoint + region (must match garage_s3_region in group_vars/ingress).
cornerstone_backup_s3_endpoint: "https://s3.jardoole.xyz"
cornerstone_backup_s3_region: "garage"

# Dedicated bucket — created by the cornerstone.yml Garage play.
cornerstone_backup_s3_bucket: "cornerstone-backup"

# 5-field cron syntax. 06:00 — paperless runs its DB and media snapshots at
# 02:00 and 04:00. That is a different host, but both upload to the same Garage
# S3 endpoint on valen, so the offset still avoids upload contention.
cornerstone_backup_schedule: "0 6 * * *"

# GFS retention policy — matches the rest of the platform.
cornerstone_backup_retention_args: "--keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 1 --prune"

# ============================================================================
# Backup manifest — consumed by roles/backup_verify and roles/backup_restore
# ============================================================================
backup_compose_dir: "{{ cornerstone_dir }}"

# The cornerstone container holds the SQLite DB open. Stop it before the
# restore handler copies data back, then bring the stack back up.
backup_consumer_services:
  - cornerstone

backups:
  - name: data
    type: restic
    compose_dir: "{{ cornerstone_dir }}"
    # The restic sidecar that owns the repo.
    compose_service: data-backup
    bucket: "{{ cornerstone_backup_s3_bucket }}"
    schedule: "{{ cornerstone_backup_schedule }}"
    # Just above the 24h cron interval to absorb skew without false alerts.
    max_age_hours: 27
    # The sidecar mounts the named volume at /data/app-data; restic stores it
    # under that path. The restore handler copies .restore/data/app-data back
    # over the live volume.
    restore_paths:
      - app-data
