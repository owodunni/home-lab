---
# Storage group defaults — apply to all hosts in [storage]
#
# Override per-host variables (storage_drives, etc.)
# in host_vars/<hostname>.yml to customise for each storage node.

# Filesystem used for data and parity partitions
storage_filesystem: ext4

# Mount options applied to all encrypted data/parity mounts
# noatime: skip access-time writes for better SSD/NVMe longevity
storage_mount_options: "defaults,noatime"

# Path on the remote host where the LUKS keyfile is stored for unattended boot
# The vault_luks_key secret is written here by disk-encrypt.yml
luks_key_remote_path: /root/.luks/luks.key

# MergerFS unified pool mount point
mergerfs_mount_point: /mnt/storage

# MergerFS mount options
# allow_other: non-root users (pods/services with arbitrary UIDs) can access the pool
# use_ino: preserve inode numbers — required for hardlinks to work across the pool
# noforget: keep inode→path mappings pinned in memory. Required when the pool is
#   re-exported over NFS (see playbooks/nfs.yml): without it MergerFS can recycle
#   inode numbers, and NFS clients then hit "Stale file handle" errors.
# cache.files=partial: cache metadata for performance
# dropcacheonclose=true: release kernel page cache when files are closed
# category.create=mfs: place new files on the drive with the most free space
mergerfs_options: "defaults,allow_other,use_ino,noforget,cache.files=partial,dropcacheonclose=true,category.create=mfs"

# ============================================================================
# Shared media ownership
# ============================================================================
# A dedicated unprivileged account owns the media tree in the pool so that
# containers — both those running locally on the storage host and those reaching
# in over NFS (see playbooks/nfs.yml) — can read/write without running as root.
#
# The UID/GID are FIXED, not just a name: NFSv4 with sec=sys identifies users by
# numeric ID over the wire, so every client container must run with the SAME
# PUID/PGID (8000) for ownership to line up. A high, dedicated ID avoids
# colliding with the login user (typically UID 1000) on any host.
storage_media_user: media
storage_media_uid: 8000
storage_media_gid: 8000

# ============================================================================
# Package versions
# ============================================================================
# Pinned upstream releases installed by snapraid-mergerfs.yml. Bump here to
# upgrade fleet-wide; override in host_vars/<host>.yml for a single node.

# MergerFS .deb release — https://github.com/trapexit/mergerfs/releases
mergerfs_version: "2.42.0"

# SnapRAID source release (built from source) — https://github.com/amadvance/snapraid/releases
snapraid_version: "14.6"

# ============================================================================
# SnapRAID — group-wide defaults
# ============================================================================
# Empty by default so hosts without a parity drive yet don't hit an
# "undefined variable" error — snapraid-mergerfs.yml skips SnapRAID entirely
# until all three are defined in host_vars/<host>/main.yml.
snapraid_parity_drives: []
snapraid_data_drives: []
snapraid_content_files: []

# ============================================================================
# SnapRAID runner — automated sync + scrub (roles/snapraid_runner)
# ============================================================================
# Installed by snapraid-mergerfs.yml only where snapraid_configured is true
# (a parity drive is present), so it activates on beelink now and on valen
# automatically once its planned parity drive is added.

# systemd OnCalendar for the daily diff → sync → scrub run. 04:30 sits after the
# service backup crons (02:00–05:00 write to Garage) but before the offsite
# mirror pull (06:00), so each day's parity reflects the freshest local data.
snapraid_runner_schedule: "*-*-* 04:30:00"

# Deletion guard: if more than this many files are removed+updated since the
# last sync, the runner REFUSES to sync (so an automated sync can't bless a mass
# deletion / ransomware run into parity) and lets SnapraidSyncStale fire. Tune
# up for hosts with legitimately high churn.
snapraid_sync_delete_threshold: 500

# scrub a slice each run: SCRUB_PERCENT of the least-recently-scrubbed blocks
# older than SCRUB_OLDER days, so the whole array is verified over time without
# a heavy full scrub. 12%/10d cycles the array roughly every ~8 days.
snapraid_scrub_percent: 12
snapraid_scrub_older_than: 10

# node_exporter textfile metric the runner writes (default textfile dir).
snapraid_runner_textfile: /var/lib/node_exporter/snapraid.prom

# ============================================================================
# HDD spin-down — group-wide defaults
# ============================================================================
# Drives opt in via storage_drives: set `spindown: true` on a drive entry in
# host_vars/<host>/main.yml (see host_vars/valen/main.yml). NVMe-only hosts
# (e.g. beelink) have no such entries and disk-spindown.yml skips entirely.

# hdparm -S value: 240 = 240*5s = 20 minutes of inactivity before spin-down.
disk_spindown_timeout: 240

# hdparm -B value: 1-127 permits the drive to spin down; 127 favours
# performance over aggressive power saving within that range.
disk_spindown_apm: 127

# ============================================================================
# smartctl_exporter — group-wide defaults (SMART drive health → Prometheus)
# ============================================================================
# Deployed by smartctl-exporter.yml on every [storage] host. Scraped by
# Prometheus on :9633 (see monitoring_smartctl_targets in group_vars/monitoring).

# Pinned upstream release — https://github.com/prometheus-community/smartctl_exporter/releases
smartctl_exporter_version: "0.14.0"

# How often the exporter runs smartctl against each device. 60s suits beelink's
# always-on NVMe. valen overrides this to 1h in host_vars/valen/main.yml because
# a SMART read wakes its spun-down HDD (disk-spindown.yml) and the exporter has
# no skip-standby flag — hourly lets the drive sleep between brief wakes.
smartctl_exporter_smartctl_interval: "60s"

# ============================================================================
# Host firewall — smartctl_exporter rule (docs/superpowers/specs/2026-07-19-host-firewalls-design.md)
# ============================================================================
# What: Allows Prometheus (pi-cm5-1) to reach smartctl_exporter's port.
# Why:  scope: host, unlike cadvisor/intel-gpu-exporter — smartctl_exporter is
#       a native binary (not a Docker container), so it binds directly and is
#       reachable through ufw's ordinary INPUT chain.
# Resolves: SMART drive-health metrics being scrapeable from the whole
#           homelab_subnet instead of only the monitoring host. Applies on
#           both [storage] hosts, including beelink — its scrape traffic
#           arrives over WireGuard, so the source IP Prometheus sees is still
#           monitoring_host regardless of the tunnel hop.
firewall_rules_smartctl_exporter:
  - name: smartctl-exporter
    port: 9633
    proto: tcp
    from: [monitoring_host]
    scope: host
    comment: "SMART drive health scrape (native binary, both storage hosts)"
