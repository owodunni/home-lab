---
# Variables for all hosts in the [monitoring] group
# (hosts running the Prometheus / Alertmanager / Grafana stack — currently pi-cm5-1)

# ============================================================================
# Node exporter scrape targets
# Keep in sync with hosts.ini. Use ansible_host where set, else inventory_hostname.
# Prometheus runs on pi-cm5-1, so localhost:9100 is pi-cm5-1's own node_exporter.
# pi-cm5-4 uses its inventory hostname directly (network issues previously required
# minio.jardoole.xyz as a workaround, but that is resolved).
# Beelink is offsite and reachable only via its WireGuard address (192.168.2.5).
# ============================================================================
monitoring_node_targets:
  - "localhost:9100"
  - "pi-cm5-2:9100"
  - "pi-cm5-3:9100"
  - "pi-cm5-4:9100"
  - "valen:9100"
  - "192.168.2.5:9100"

# ============================================================================
# smartctl_exporter scrape targets (SMART drive health)
# Storage hosts only — the disks worth monitoring live there. Deployed by
# smartctl-exporter.yml on the [storage] group; exposes :9633.
# beelink is offsite, reachable only via its WireGuard address (192.168.2.5);
# valen is on the home LAN. Mirrors the addressing used for node targets above.
# ============================================================================
monitoring_smartctl_targets:
  - "valen:9633"
  - "192.168.2.5:9633"

# ============================================================================
# cAdvisor scrape targets (per-container resource metrics)
# The Docker fleet ([services]: pi-cm5-1..4 + valen). Deployed by cadvisor.yml;
# published on host port 9101 (NOT cAdvisor's default 8080 — Traefik's dashboard
# and qBittorrent already bind 8080 on some of these hosts). Prometheus runs on
# pi-cm5-1, so localhost is pi-cm5-1's own cAdvisor. beelink is absent on purpose:
# it runs Garage as a binary, not Docker, so it has no containers to scrape.
# ============================================================================
monitoring_cadvisor_targets:
  - "localhost:9101"
  - "pi-cm5-2:9101"
  - "pi-cm5-3:9101"
  - "pi-cm5-4:9101"
  - "valen:9101"

# ============================================================================
# Intel GPU exporter scrape target (iGPU transcode load)
# valen only — it is the single host with an Intel iGPU (Jellyfin QuickSync).
# Deployed by intel-gpu-exporter.yml on [media]; published on host port 9102.
# ============================================================================
monitoring_intel_gpu_targets:
  - "valen:9102"

# ============================================================================
# Blackbox exporter (HTTP front-door probes) — prometheus.prometheus role
# What: Config for the blackbox_exporter on the [monitoring] host (deployed by
#       blackbox-exporter.yml). It probes each routed service's HTTPS front door
#       and exports probe_success (liveness) + probe_ssl_earliest_cert_expiry.
# Why:  node_exporter/cadvisor miss "container Up but the app's HTTP front door is
#       broken" (5xx, crashed frontend, mis-routed Traefik, expired cert). This is
#       that application-reachability layer. Bound to loopback — Prometheus scrapes
#       it locally, same as the rest of the stack.
# Resolves: These deploy-time values live with the [monitoring] group, not the role
#           (no-role-defaults rule in CLAUDE.md).
# ============================================================================
blackbox_exporter_version: "0.28.0"

# Loopback only — Prometheus scrapes over localhost; no external exposure.
blackbox_exporter_web_listen_address: "127.0.0.1:9115"

# Single custom probe module used by the blackbox scrape job below.
blackbox_exporter_configuration_modules:
  http_app_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      # Force the IPv4 CNAME to the LAN Traefik, NOT the IPv6/Cloudflare AAAA
      # (Ubiquiti split-horizon overrides only the A record). Keeps the probe
      # origin-direct: our Traefik + app + real origin cert, never Cloudflare.
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      # Test the front door's own response; do not chase login redirects into auth
      # flows (which would turn a 302 login into a 200 and hide a broken app).
      follow_redirects: false
      # Every routed endpoint answers with one of these to an unauthenticated,
      # no-redirect probe (verified: 200 vaultwarden/alertmanager, 302 most,
      # 307 jellyseerr, 403 garage S3). 301/308/401 kept for future basic-auth /
      # relocated routes.
      valid_status_codes: [200, 204, 301, 302, 307, 308, 401, 403]
      # Verify the real origin wildcard cert (SNI is taken from the target host).
      tls_config: {}

# --- Blackbox service registry (single source of truth for what is probed) ----
# Keyed by the Traefik template's service name (traefik-<name>.yml.j2). EVERY
# routed service MUST appear here — scripts/check-blackbox-coverage.py fails the
# commit otherwise, so a new service cannot be silently unmonitored.
#   kind: app  -> own/no auth: probe_success is a trustworthy liveness signal.
#   kind: edge -> behind Authentik forward-auth: an unauthenticated probe only
#                 reaches Authentik, so probe_success is a false-green for
#                 liveness. Probed for CERT coverage only; excluded from the
#                 liveness alert via the probe_kind label (see the scrape job).
#   url:  full https:// target (explicit so every probed URL is visible here).
monitoring_blackbox_services:
  jellyseerr: {kind: app, url: "https://jellyseerr.{{ traefik_domain }}"}
  jellyfin: {kind: app, url: "https://jellyfin.{{ traefik_domain }}"}
  nextcloud: {kind: app, url: "https://nextcloud.{{ traefik_domain }}"}
  vaultwarden: {kind: app, url: "https://vaultwarden.{{ traefik_domain }}"}
  grafana: {kind: app, url: "https://grafana.{{ traefik_domain }}"}
  authentik: {kind: app, url: "https://auth.{{ traefik_domain }}"}
  prometheus: {kind: app, url: "https://prometheus.{{ traefik_domain }}"}
  alertmanager: {kind: app, url: "https://alertmanager.{{ traefik_domain }}"}
  garage: {kind: app, url: "https://s3.{{ traefik_domain }}"}
  # Forward-auth apps: probed for cert coverage, excluded from the liveness alert.
  radarr: {kind: edge, url: "https://radarr.{{ traefik_domain }}"}
  sonarr: {kind: edge, url: "https://sonarr.{{ traefik_domain }}"}
  prowlarr: {kind: edge, url: "https://prowlarr.{{ traefik_domain }}"}
  qbittorrent: {kind: edge, url: "https://qbittorrent.{{ traefik_domain }}"}

# Probe target lists DERIVED from the registry (edit the registry, not these).
# The scrape job labels each group with probe_kind so the liveness alert scopes
# to app-only.
monitoring_blackbox_targets:
  app: >-
    {{ monitoring_blackbox_services | dict2items
    | selectattr('value.kind', 'equalto', 'app')
    | map(attribute='value.url') | list }}
  edge: >-
    {{ monitoring_blackbox_services | dict2items
    | selectattr('value.kind', 'equalto', 'edge')
    | map(attribute='value.url') | list }}

# ============================================================================
# Prometheus
# ============================================================================
prometheus_version: "3.4.0"

# Bind to loopback — Grafana accesses over localhost; no external port exposure needed
prometheus_web_listen_address: "127.0.0.1:9090"

prometheus_storage_retention: "30d"

prometheus_global:
  scrape_interval: 15s
  evaluation_interval: 15s

prometheus_alertmanager_config:
  - static_configs:
      - targets:
          - "localhost:9093"

prometheus_scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
  - job_name: "node"
    static_configs:
      - targets: "{{ monitoring_node_targets }}"
  - job_name: "smartctl"
    static_configs:
      - targets: "{{ monitoring_smartctl_targets }}"
  - job_name: "cadvisor"
    static_configs:
      - targets: "{{ monitoring_cadvisor_targets }}"
  - job_name: "intel_gpu"
    static_configs:
      - targets: "{{ monitoring_intel_gpu_targets }}"
  # Blackbox multi-target: each target URL is passed to the exporter as
  # __param_target; instance becomes the URL; probe_kind labels app vs edge so
  # the liveness alert can exclude forward-auth (edge) targets.
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_app_2xx]
    static_configs:
      - targets: "{{ monitoring_blackbox_targets.app }}"
        labels:
          probe_kind: app
      - targets: "{{ monitoring_blackbox_targets.edge }}"
        labels:
          probe_kind: edge
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "127.0.0.1:9115"
  - job_name: "alertmanager"
    static_configs:
      - targets:
          - "localhost:9093"

prometheus_alert_rules:
  - alert: InstanceDown
    # up{job="node"} == 0 means node_exporter on that host is unreachable
    expr: "up == 0"
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "{% raw %}{{ $labels.instance }} is unreachable{% endraw %}"
      description: >-
        {% raw %}{{ $labels.instance }} (job: {{ $labels.job }}) has been unreachable
        for more than 5 minutes.{% endraw %}
  - alert: HighDiskUsage
    expr: >-
      (node_filesystem_size_bytes{fstype!~"tmpfs|squashfs"}
      - node_filesystem_free_bytes{fstype!~"tmpfs|squashfs"})
      / node_filesystem_size_bytes{fstype!~"tmpfs|squashfs"} > 0.85
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}High disk usage on {{ $labels.instance }}{% endraw %}"
      description: >-
        {% raw %}Mountpoint {{ $labels.mountpoint }} on {{ $labels.instance }}
        is above 85% full.{% endraw %}
  - alert: HighMemoryUsage
    expr: >-
      (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
      / node_memory_MemTotal_bytes > 0.90
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}High memory usage on {{ $labels.instance }}{% endraw %}"
      description: >-
        {% raw %}Memory usage on {{ $labels.instance }} has been above 90%
        for more than 10 minutes.{% endraw %}

  # --- Offsite backup mirror freshness (backup_mirror on [backup_mirror]) ----
  # The offsite analogue of `make verify-backups` (which checks the local/valen
  # side). The mirror sync script writes these textfile metrics on beelink after
  # each pull; if the offsite copy stops updating we want to know before a real
  # disaster needs it.
  - alert: BackupMirrorStale
    # 26h grace over the daily 06:00 pull (so a single delayed run does not trip
    # it, but a genuinely missed day does). `time() - ...` is the age in seconds.
    expr: "time() - backup_mirror_last_success_timestamp_seconds > 93600"
    for: 30m
    labels:
      severity: critical
    annotations:
      summary: "{% raw %}Offsite backup mirror is stale on {{ $labels.instance }}{% endraw %}"
      description: >-
        {% raw %}The offsite backup mirror has not completed successfully for
        over 26h ({{ $value | humanizeDuration }} ago). The offsite copy of the
        fleet's backups is no longer current.{% endraw %}
  - alert: BackupMirrorRunFailed
    # The most recent pull had at least one bucket fail to sync.
    expr: "backup_mirror_run_success == 0"
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}Offsite backup mirror run failed on {{ $labels.instance }}{% endraw %}"
      description: >-
        {% raw %}The last offsite backup mirror pull reported a failure for at
        least one bucket. Check `journalctl -u backup-mirror` on the mirror
        host.{% endraw %}

  # --- Local backup freshness (backup_freshness on each service host) --------
  # The LOCAL/valen-side analogue of BackupMirrorStale. roles/backup_freshness
  # exports each backup's newest-snapshot timestamp + its configured window; the
  # rule below fires when a service's own backup sidecar stops producing fresh
  # snapshots. This is the gap the offsite mirror could NOT cover: the additive
  # pull keeps succeeding even when nothing new arrives, so BackupMirrorStale
  # stays green while the source backup is silently broken.
  - alert: BackupLocalStale
    # Per-backup threshold: compare each backup's age to its own max_age_seconds
    # (from its manifest max_age_hours). ignoring(__name__) matches the two
    # series on {service,backup,instance} — the arithmetic on the left already
    # dropped the metric name.
    expr: >-
      (time() - backup_local_last_snapshot_timestamp_seconds)
      > ignoring(__name__) backup_local_snapshot_max_age_seconds
    for: 30m
    labels:
      severity: critical
    annotations:
      summary: "{% raw %}Local backup stale: {{ $labels.service }}/{{ $labels.backup }}{% endraw %}"
      description: >-
        {% raw %}The newest local restic snapshot for {{ $labels.service }}
        backup "{{ $labels.backup }}" on {{ $labels.instance }} is older than its
        freshness window ({{ $value | humanizeDuration }} since the last
        snapshot). The service's backup sidecar may have stopped — check it
        before the offsite copy ages out too.{% endraw %}
  - alert: BackupLocalCheckFailed
    # The exporter itself could not query a repo (sidecar down, repo
    # unreachable) — backups are no longer being verified even if they still run.
    expr: "backup_local_check_success == 0"
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}Local backup freshness check failing for {{ $labels.service }}{% endraw %}"
      description: >-
        {% raw %}The backup freshness exporter on {{ $labels.instance }} could
        not read every restic repo for {{ $labels.service }}. Backups are not
        being verified — check the sidecars and
        `journalctl -u backup-freshness-{{ $labels.service }}`.{% endraw %}

  # --- SnapRAID parity health (snapraid_runner on [storage] hosts w/ parity) -
  # The runner (roles/snapraid_runner) diffs → syncs → scrubs daily and writes
  # these textfile metrics. Series only exist where parity is configured, so
  # hosts without it raise nothing.
  - alert: SnapraidSyncGuardTripped
    # The deletion guard refused to sync because too many files vanished — a
    # likely mass deletion / ransomware event on the pool. Parity is deliberately
    # NOT updated; a human must investigate before the protected state is lost.
    expr: "snapraid_sync_delete_guard_tripped == 1"
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: "{% raw %}SnapRAID deletion guard tripped on {{ $labels.instance }}{% endraw %}"
      description: >-
        {% raw %}snapraid-runner refused an automatic sync because more files
        were removed/updated than the configured threshold. Investigate for
        accidental or malicious deletion before running 'snapraid sync' by
        hand.{% endraw %}
  - alert: SnapraidSyncStale
    # 26h grace over the daily run; if sync stops succeeding parity drifts from
    # the data and a drive loss may be unrecoverable.
    expr: "time() - snapraid_last_sync_success_timestamp_seconds > 93600"
    for: 30m
    labels:
      severity: critical
    annotations:
      summary: "{% raw %}SnapRAID sync stale on {{ $labels.instance }}{% endraw %}"
      description: >-
        {% raw %}snapraid sync has not succeeded for over 26h
        ({{ $value | humanizeDuration }} ago). Parity may not protect recent
        changes.{% endraw %}
  - alert: SnapraidScrubStale
    # Scrub is what detects silent bit-rot; if it stops running, corruption goes
    # unnoticed until a restore fails.
    expr: "time() - snapraid_last_scrub_success_timestamp_seconds > 93600"
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}SnapRAID scrub stale on {{ $labels.instance }}{% endraw %}"
      description: >-
        {% raw %}snapraid scrub has not succeeded for over 26h
        ({{ $value | humanizeDuration }} ago) — silent bit-rot is no longer being
        detected. Check `journalctl -u snapraid-runner`.{% endraw %}

  # --- SMART drive health (smartctl_exporter on [storage] hosts) ------------
  # Metric names follow smartctl_exporter 0.14. ATA attributes are matched by
  # name on the raw value; NVMe health uses the dedicated nvme metrics.
  - alert: SmartDeviceHealthFailed
    # smartctl_device_smart_status == 0 means the drive's own overall-health
    # self-assessment reports FAILED — replace the disk promptly.
    expr: "smartctl_device_smart_status == 0"
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "{% raw %}SMART health FAILED on {{ $labels.instance }} ({{ $labels.device }}){% endraw %}"
      description: >-
        {% raw %}Device {{ $labels.device }} on {{ $labels.instance }} reports a
        failed SMART overall-health self-assessment. Back up and replace it.{% endraw %}
  - alert: SmartctlExporterDown
    expr: 'up{job="smartctl"} == 0'
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "{% raw %}smartctl_exporter down on {{ $labels.instance }}{% endraw %}"
      description: >-
        {% raw %}smartctl_exporter on {{ $labels.instance }} has been
        unreachable for more than 5 minutes — drive health is not being
        monitored.{% endraw %}
  - alert: SmartReallocatedSectors
    # Reallocated sectors are a leading indicator of HDD surface failure; any
    # non-zero count warrants attention.
    expr: >-
      smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"} > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}Reallocated sectors on {{ $labels.instance }} ({{ $labels.device }}){% endraw %}"
      description: >-
        {% raw %}Device {{ $labels.device }} on {{ $labels.instance }} has
        {{ $value }} reallocated sector(s) — a sign of media degradation.{% endraw %}
  - alert: SmartPendingSectors
    expr: >-
      smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"} > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}Pending sectors on {{ $labels.instance }} ({{ $labels.device }}){% endraw %}"
      description: >-
        {% raw %}Device {{ $labels.device }} on {{ $labels.instance }} has
        {{ $value }} current-pending sector(s) awaiting reallocation.{% endraw %}
  - alert: SmartHighTemperature
    # 60 °C is a safe generic ceiling for both the IronWolf HDD and the NVMe
    # drives; tune per-drive later if needed.
    expr: 'smartctl_device_temperature{temperature_type="current"} > 60'
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}High drive temperature on {{ $labels.instance }} ({{ $labels.device }}){% endraw %}"
      description: >-
        {% raw %}Device {{ $labels.device }} on {{ $labels.instance }} has been
        above 60°C ({{ $value }}°C) for more than 10 minutes.{% endraw %}
  - alert: NvmeMediaErrors
    expr: "smartctl_device_media_errors > 0"
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}NVMe media errors on {{ $labels.instance }} ({{ $labels.device }}){% endraw %}"
      description: >-
        {% raw %}Device {{ $labels.device }} on {{ $labels.instance }} reports
        {{ $value }} NVMe media/data-integrity error(s).{% endraw %}
  - alert: NvmeWearout
    # percentage_used is the NVMe endurance estimate; >90% means the drive is
    # near its rated write life.
    expr: "smartctl_device_percentage_used > 90"
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}NVMe wearout high on {{ $labels.instance }} ({{ $labels.device }}){% endraw %}"
      description: >-
        {% raw %}Device {{ $labels.device }} on {{ $labels.instance }} is at
        {{ $value }}% of its rated write endurance.{% endraw %}
  - alert: NvmeSpareLow
    # Available spare blocks have dropped below the drive's own threshold — a
    # SMART-defined imminent-failure condition for NVMe.
    expr: "smartctl_device_available_spare < smartctl_device_available_spare_threshold"
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}NVMe spare blocks low on {{ $labels.instance }} ({{ $labels.device }}){% endraw %}"
      description: >-
        {% raw %}Device {{ $labels.device }} on {{ $labels.instance }} has
        available spare below its threshold — replace soon.{% endraw %}

  # --- Container health (cAdvisor on the [services] Docker fleet) ------------
  # Deliberately low-noise: capacity itself (is a Pi overloaded?) is read off the
  # Grafana dashboard, not paged on — sustained CPU/memory thresholds are
  # workload-specific and noisy, and host-level pressure is already covered by
  # HighMemoryUsage / HighDiskUsage above. These rules fire only on the
  # unambiguous failure signals that warrant action. (cAdvisor being down is
  # already caught by the unlabelled InstanceDown rule: up == 0.)
  - alert: ContainerOOMKilled
    # An OOM kill means a container hit a memory ceiling and was reaped. On the
    # RAM-limited Pis this is the clearest "this host is overcommitted — move a
    # service off it" signal, which is exactly the placement question cAdvisor
    # is here to answer.
    expr: 'increase(container_oom_events_total{name!=""}[10m]) > 0'
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}Container OOM-killed on {{ $labels.instance }} ({{ $labels.name }}){% endraw %}"
      description: >-
        {% raw %}Container {{ $labels.name }} on {{ $labels.instance }} was
        OOM-killed in the last 10 minutes — the host is under memory pressure.
        Consider moving a service to another Pi.{% endraw %}
  - alert: ContainerFrequentRestart
    # container_start_time_seconds jumps to a new value on each (re)start; many
    # changes in a short window means the container is crash-looping rather than
    # running steadily.
    expr: 'changes(container_start_time_seconds{name!=""}[15m]) > 3'
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}Container restarting repeatedly on {{ $labels.instance }} ({{ $labels.name }}){% endraw %}"
      description: >-
        {% raw %}Container {{ $labels.name }} on {{ $labels.instance }} has
        restarted more than 3 times in 15 minutes — likely crash-looping.{% endraw %}

  # --- Application front-door health (blackbox_exporter on [monitoring]) ------
  # blackbox probes each routed service's HTTPS front door (see the blackbox
  # config + registry above). Catches "container Up but the app is not serving"
  # and near-expiry TLS — the gap node_exporter/cadvisor cannot see.
  - alert: BlackboxProbeFailed
    # Scoped to probe_kind="app": forward-auth (edge) targets return Authentik's
    # redirect without Traefik reaching the backend, so their probe_success is a
    # false-green for liveness and must NOT page. app targets answer for
    # themselves, so probe_success == 0 means the front door is genuinely broken.
    expr: 'probe_success{probe_kind="app"} == 0'
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "{% raw %}App front door down: {{ $labels.instance }}{% endraw %}"
      description: >-
        {% raw %}The blackbox probe of {{ $labels.instance }} has failed for over
        5 minutes (unreachable or an unexpected HTTP status). The container may be
        Up while the application is not actually serving.{% endraw %}
  - alert: BlackboxCertExpiringSoon
    # Unscoped (app + edge): the TLS handshake completes before any HTTP response,
    # so cert expiry is a valid signal for every routed service. Safety net for a
    # stalled Traefik ACME renewal (which normally renews at ~30 days remaining).
    # Forced to IPv4, so it checks the real origin wildcard cert.
    expr: "probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600"
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: "{% raw %}TLS cert expiring soon for {{ $labels.instance }}{% endraw %}"
      description: >-
        {% raw %}The origin TLS certificate served for {{ $labels.instance }}
        expires in {{ $value | humanizeDuration }}. Check Traefik's ACME renewal
        before it lapses.{% endraw %}

# ============================================================================
# Alertmanager
# ============================================================================
alertmanager_version: "0.28.1"

# Bind to loopback — not exposed externally
alertmanager_web_listen_address: "127.0.0.1:9093"

alertmanager_smtp:
  from: "{{ smtp_from }}"
  smarthost: "{{ smtp_host }}:{{ smtp_port }}"
  auth_username: "{{ vault_smtp_username }}"
  auth_password: "{{ vault_smtp_password }}"
  require_tls: true

alertmanager_receivers:
  - name: "email"
    email_configs:
      - to: "alex.o.poole@gmail.com"
        send_resolved: true

alertmanager_route:
  group_by:
    - alertname
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "email"

alertmanager_inhibit_rules:
  # Suppress warning-severity duplicates when a critical alert fires for
  # the same instance and alertname — avoids alert noise.
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal:
      - alertname
      - instance

# ============================================================================
# Grafana (grafana.grafana collection)
# ============================================================================
grafana_version: "latest"

# grafana_ini maps directly to grafana.ini sections.
# The role merges this with grafana_ini_default (role defaults/main.yml).
grafana_ini:
  server:
    # Bind to loopback — Traefik terminates TLS and proxies inbound
    http_addr: "127.0.0.1"
    http_port: 3000
    # External URL used in alert links and OAuth redirects
    root_url: "https://grafana.{{ traefik_domain }}"
  security:
    admin_user: admin
    admin_password: "{{ vault_grafana_admin_password }}"

  auth:
    # What: match a returning SSO user by email when Authentik's OIDC subject
    #   (`sub`) no longer matches the stored one.
    # Why:  Grafana keys each OAuth account on `auth_id` = the Authentik `sub`
    #   (a hash that rotates if the Authentik provider/application is recreated
    #   or its subject settings change). When the `sub` changes, Grafana finds
    #   no linked account, tries to *create* a new user, and the insert collides
    #   with the existing account's email — surfacing in the UI as the
    #   misleading "user sync failed" (logs: `Failed to create user: user not
    #   found`). Email lookup instead re-links the existing user to the new
    #   `sub`, so a subject change no longer locks the operator out.
    # Resolves: Grafana↔Authentik SSO login failing with "user sync failed".
    # Safe here: a single trusted IdP (Authentik) with unique, validated,
    #   non-editable emails — the single-tenant case Grafana documents this for.
    oauth_allow_insecure_email_lookup: true

  auth.generic_oauth:
    enabled: true
    name: Authentik
    allow_sign_up: true
    client_id: "{{ vault_grafana_oauth_client_id }}"
    client_secret: "{{ vault_grafana_oauth_client_secret }}"
    scopes: "openid email profile"
    auth_url: "https://auth.{{ traefik_domain }}/application/o/authorize/"
    token_url: "https://auth.{{ traefik_domain }}/application/o/token/"
    api_url: "https://auth.{{ traefik_domain }}/application/o/userinfo/"
    # Map Authentik groups to Grafana roles; defaults to Viewer if no group matches
    role_attribute_path: >-
      contains(groups[*], 'Grafana Admins') && 'Admin' ||
      contains(groups[*], 'Grafana Editors') && 'Editor' ||
      'Viewer'

grafana_datasources:
  - name: Prometheus
    type: prometheus
    url: "http://localhost:9090"
    isDefault: true
    access: proxy
    jsonData:
      timeInterval: "15s"

# Local dashboard JSON directory (controller-side), provisioned by the
# grafana.grafana role alongside the grafana.com downloads below. Absolute path
# via inventory_dir (= repo root, where hosts.ini lives) so the role's fileglob
# resolves regardless of which playbook imports it. Holds the Intel GPU dashboard,
# which has no grafana.com ID — it ships only as JSON in the exporter's repo.
grafana_dashboards_dir: "{{ inventory_dir }}/files/grafana-dashboards"

# Dashboards auto-provisioned from grafana.com by the grafana.grafana role.
# Each is downloaded at deploy time and wired to the Prometheus datasource.
# (The Intel GPU dashboard is provisioned from grafana_dashboards_dir above, not
# here — it is not published on grafana.com.)
grafana_dashboards:
  # "SMARTctl Exporter Dashboard" — drive health overview (SMART status,
  # temperature, reallocated/pending sectors, NVMe wearout). Pairs with the
  # smartctl scrape job + SMART alert rules above.
  # https://grafana.com/grafana/dashboards/22604
  - dashboard_id: 22604
    revision_id: 2
    datasource: Prometheus
  # "Cadvisor exporter" — per-container CPU, memory, network, and disk metrics
  # for the Docker fleet, broken down by container. The view for deciding whether
  # a service should move to a different Pi. Pairs with the cadvisor scrape job +
  # container alert rules above.
  # https://grafana.com/grafana/dashboards/14282
  - dashboard_id: 14282
    revision_id: 1
    datasource: Prometheus
  # "Prometheus Blackbox Exporter" — per-target probe success, HTTP status, probe
  # duration, and TLS cert expiry for the routed-service front-door probes. Pairs
  # with the blackbox scrape job + BlackboxProbeFailed/BlackboxCertExpiringSoon.
  # https://grafana.com/grafana/dashboards/7587
  - dashboard_id: 7587
    revision_id: 3
    datasource: Prometheus
