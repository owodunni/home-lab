---
# Media host configuration — variables shared by every media-stack service.
#
# What: Common storage layout and runtime identity for the media stack. valen is
#       in [media] (the media-host group) AND in each per-service group
#       ([qbittorrent], [radarr], …), so Ansible merges these vars into every
#       media service play even though the play targets the service group.
# Why:  Single source of truth for the shared /data pool and the media account,
#       so a path or UID change is one edit, not one-per-service.
# Resolves: All media apps must agree on the same /data mount and UID/GID for
#           hardlinks (one filesystem) and pool ownership to work.

# ============================================================================
# Shared media data pool (local on valen — bind-mounted, NOT NFS)
# ============================================================================
# Root of the media tree on valen's MergerFS pool. Every app bind-mounts this
# whole tree at /data so qBittorrent's downloads and Radarr/Sonarr's library
# live under one mount — required for hardlinks (cross-mount hardlinks fail).
media_data_root: "{{ mergerfs_mount_point }}/media"

# Subdirectories created under media_data_root by playbooks/media-storage.yml.
# torrents/* are qBittorrent's save paths; media/* are the *arr root folders.
media_data_subdirs:
  - torrents/incomplete
  - torrents/movies
  - torrents/tv
  - media/movies
  - media/tv

# ============================================================================
# Shared Docker network — cross-stack service-to-service connectivity
# ============================================================================
# WHAT: a single user-defined bridge ("media", fixed subnet) that every media
#   compose stack attaches to as an EXTERNAL network.
# WHY: the stacks are separate compose projects, so they cannot reach each other
#   by container name unless they share one network. The *arr apps need to reach
#   qBittorrent's WebUI (download client) and each other (Prowlarr sync) WITHOUT
#   going through the public Traefik+Authentik URL — the WebUI is published on
#   loopback only (so valen's LAN IP refuses the connection), and the public URL
#   is gated by forward-auth (which qBittorrent's keyless API cannot satisfy).
#   On this network qBittorrent's WebUI is reachable at http://gluetun:8080 and
#   auto-authenticated by its own {{ media_docker_subnet }} auth-bypass whitelist.
# RESOLVES: the "unable to connect" (LAN IP) / auth-redirect (public URL) errors
#   when wiring Radarr/Sonarr → qBittorrent.
#
# The network is CREATED once by playbooks/media-network.yml (first in the
# applications-layer media sequence, before any media service) and referenced as
# `external: true` by every stack — so deploy order does NOT matter and each
# service stays independently deployable (make app service=<name>) without a
# network-owner dependency.
# Fixed subnet so gluetun's firewall (FIREWALL_OUTBOUND_SUBNETS) and
# qBittorrent's auth-bypass whitelist can name it.
media_docker_network: media
media_docker_subnet: "172.28.0.0/16"

# Runtime identity for the LinuxServer.io containers (PUID/PGID). 8000 is the
# pool media account that owns media_data_root (storage_media_uid/gid from
# group_vars/storage), so files the containers write land with correct pool
# ownership.
media_puid: "{{ storage_media_uid }}"
media_pgid: "{{ storage_media_gid }}"

# IANA timezone for all media containers (scheduling, log timestamps).
media_time_zone: "Etc/UTC"
