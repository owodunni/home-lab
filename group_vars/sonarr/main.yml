---
# Sonarr service configuration — TV series manager (service 4 of the media-stack
# migration). Pulls indexers from Prowlarr and sends downloads to qBittorrent,
# then imports finished episodes into the library by hardlink.
# Secrets (backup S3 key, restic password) live in group_vars/sonarr/vault.yml
# with the vault_ prefix.
#
# Shared media vars (media_data_root, media_puid/pgid, media_time_zone) come from
# group_vars/media — valen is in both [sonarr] and [media].

# ============================================================================
# Image — pinned upstream tag (matches the master/K8s deploy)
# ============================================================================
# Sonarr (LinuxServer.io). Tags: https://hub.docker.com/r/linuxserver/sonarr
sonarr_image: "lscr.io/linuxserver/sonarr:4.0.2"

# ============================================================================
# Placement and routing
# ============================================================================
# Directory on valen holding the compose stack + .env (not the app data).
sonarr_dir: /opt/sonarr

# Sonarr's /config (settings DB, quality profiles, app connections, API key) —
# a local bind. Small and app-private. NOT on the media tree (the bulk library,
# mounted separately at /data below).
sonarr_config_dir: "{{ sonarr_dir }}/config"

# WebUI/API port. Published on 127.0.0.1 only; Traefik on valen proxies to it.
sonarr_port: 8989

# Public hostname. Traefik terminates TLS (wildcard) and routes
# Host(sonarr.jardoole.xyz) → 127.0.0.1:{{ sonarr_port }}, behind the Authentik
# forward-auth middleware. DNS must resolve this name to valen.
sonarr_hostname: "sonarr.{{ traefik_domain }}"

# ============================================================================
# Logging
# ============================================================================
sonarr_log_max_size: "20m"
sonarr_log_max_file: "3"

# ============================================================================
# Config backup — restic snapshot of /config → Garage S3 (offsite, beelink)
# ============================================================================
# WHAT: a lobaro/restic-backup-docker sidecar snapshots Sonarr's /config dir on a
#   schedule to a dedicated Garage S3 bucket. /config holds the quality/release-
#   profile tuning, root-folder and naming settings, the Prowlarr/qBittorrent
#   connections, and the API key — all configured by hand.
# WHY: rebuilding that tuning from scratch is tedious and error-prone. An offsite
#   restic copy captures it once and makes it restore-any-snapshot, through the
#   same generic tooling as every other service.
# RESOLVES: re-tuning Sonarr from scratch after a host/disk loss.
#
# Bring-your-own credentials (vaulted, generated before first run):
#   vault_sonarr_backup_s3_access_key / _secret_key
#     scripts/garage-keygen.sh vault_sonarr_backup_s3
#   vault_sonarr_restic_password — openssl rand -base64 32.
#     LOSING IT MAKES EVERY EXISTING SNAPSHOT UNRECOVERABLE.
# The sonarr.yml Garage play imports the key into the bucket; the deploy feeds the
# same values to the config-backup sidecar. One source of truth.

# lobaro/restic-backup-docker — runs restic on the BACKUP_CRON schedule.
# Releases: https://github.com/lobaro/restic-backup-docker/releases
sonarr_backup_image_version: "v1.4.2"

# Garage exposes its S3 API at s3.jardoole.xyz via Traefik on beelink; region
# label must match garage_s3_region in group_vars/ingress/main.yml.
sonarr_backup_s3_endpoint: "https://s3.jardoole.xyz"
sonarr_backup_s3_region: "garage"

# Dedicated bucket — created by the sonarr.yml Garage play, isolated from the
# other services' backup buckets so retention/keys are independent per service.
sonarr_backup_s3_bucket: "sonarr-backup"

# 5-field crond syntax. Offset to 07:00 so it does not contend for upload
# bandwidth with the qBittorrent (04:00) / Prowlarr (05:00) / Radarr (06:00) runs.
sonarr_backup_schedule: "0 7 * * *"

# Passed to `restic forget` after each run. GFS policy kept identical to the other
# services so every snapshot ages out the same way; --prune reclaims the space.
sonarr_backup_retention_args: "--keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 1 --prune"

# ----------------------------------------------------------------------------
# Backup manifest — consumed by the generic verify/restore tooling
# (roles/backup_verify, roles/backup_restore; playbooks verify-backups.yml and
# restore-backups.yml). See CLAUDE.md → "Backups: verify & restore".
# ----------------------------------------------------------------------------
# Compose project dir the restore playbook stops/starts as a whole.
backup_compose_dir: "{{ sonarr_dir }}"

# Compose services that hold /config open. The restore playbook stops these before
# copying the restored config back (so Sonarr is not writing its settings DB
# mid-restore), then brings the whole stack up again. The config-backup sidecar is
# intentionally left running.
backup_consumer_services:
  - sonarr

backups:
  - name: config
    type: restic
    compose_dir: "{{ sonarr_dir }}"
    # The restic sidecar that owns the repo (list/verify/restore run through it).
    compose_service: config-backup
    bucket: "{{ sonarr_backup_s3_bucket }}"
    schedule: "{{ sonarr_backup_schedule }}"
    # A backup older than this fails verification. Set just above the 24h cron
    # interval to absorb run-time skew without flagging a healthy daily backup.
    max_age_hours: 27
    # Paths (relative to compose_dir) the restic restore copies back over. The
    # sidecar mounts the config dir at /data/config, so restic stores it under
    # data/config and the handler restores it to {{ sonarr_dir }}/config.
    restore_paths:
      - config
