---
- name: Create Unpackerr stack directory
  # Holds only the compose file + .env. Unpackerr is stateless — no app-data dir.
  ansible.builtin.file:
    path: "{{ unpackerr_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ unpackerr_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (the Sonarr/Radarr API keys).
  ansible.builtin.template:
    src: env.j2
    dest: "{{ unpackerr_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Start Unpackerr stack
  community.docker.docker_compose_v2:
    project_src: "{{ unpackerr_dir }}"
    state: present
    pull: always
    remove_orphans: true
