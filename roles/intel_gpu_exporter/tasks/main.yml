---
- name: Create Intel GPU exporter stack directory
  # Holds only the compose file. The exporter keeps no persistent state —
  # Prometheus is the time-series store — so there is no config/data bind.
  ansible.builtin.file:
    path: "{{ intel_gpu_exporter_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Template Intel GPU exporter docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ intel_gpu_exporter_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Start Intel GPU exporter stack
  community.docker.docker_compose_v2:
    project_src: "{{ intel_gpu_exporter_dir }}"
    state: present
    pull: always
    remove_orphans: true
