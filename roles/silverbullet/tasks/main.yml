---
- name: Create SilverBullet stack directory
  # Holds only the compose file + .env. App data lives in the data bind below.
  ansible.builtin.file:
    path: "{{ silverbullet_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create SilverBullet data directory
  # The server state: wiki spaces + users.json + authentication.json.
  # root-owned on purpose — SilverBullet's entrypoint infers PUID/PGID from this
  # directory's owner, so root here means the server runs as root inside its own
  # container (upstream's default, and how the upstream docs' ./data mapping
  # behaves). 0750 keeps it unreadable to unprivileged host users, matching the
  # other service data dirs. Set PUID/PGID in the container to run it as someone
  # else — see group_vars/silverbullet/main.yml.
  ansible.builtin.file:
    path: "{{ silverbullet_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ silverbullet_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (backup S3 key, restic password).
  ansible.builtin.template:
    src: env.j2
    dest: "{{ silverbullet_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Start SilverBullet stack
  community.docker.docker_compose_v2:
    project_src: "{{ silverbullet_dir }}"
    state: present
    pull: always
    remove_orphans: true
