---
- name: Create Seafile stack directory
  # Holds only the compose file + .env. Persistent data lives in volumes:
  # file data on NFS (seafile-data) and the MariaDB data on a local named
  # volume — nothing user-facing is stored under this path.
  ansible.builtin.file:
    path: "{{ seafile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ seafile_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (DB passwords, JWT key, Redis password,
  # initial admin password).
  ansible.builtin.template:
    src: env.j2
    dest: "{{ seafile_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Start Seafile stack
  community.docker.docker_compose_v2:
    project_src: "{{ seafile_dir }}"
    state: present
    pull: always
    remove_orphans: true
