---
# Fallback defaults for the prowlarr role. Production values are set in
# group_vars/prowlarr/main.yml and group_vars/media; these keep the role runnable
# standalone and document every variable it consumes.

prowlarr_image: "lscr.io/linuxserver/prowlarr:2.1.5"

prowlarr_dir: /opt/prowlarr
prowlarr_config_dir: "{{ prowlarr_dir }}/config"
prowlarr_port: 9696

prowlarr_log_max_size: "20m"
prowlarr_log_max_file: "3"

# Config backup (restic → Garage S3). See group_vars/prowlarr/main.yml for the
# rationale and the vault credentials the sidecar needs.
prowlarr_backup_image_version: "v1.4.2"
prowlarr_backup_s3_endpoint: "https://s3.jardoole.xyz"
prowlarr_backup_s3_region: "garage"
prowlarr_backup_s3_bucket: "prowlarr-backup"
prowlarr_backup_schedule: "0 5 * * *"
prowlarr_backup_retention_args: "--keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 1 --prune"

# Note: the shared media_puid / media_pgid / media_time_zone vars consumed by this
# role's templates are provided by group_vars/media (valen is in [media]). They are
# intentionally NOT redefined here — role defaults must carry the prowlarr_ prefix,
# and these are fleet-shared, not role-private.
