---
- name: Create Paperless stack directory
  ansible.builtin.file:
    path: "{{ paperless_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the NFS media mountpoint
  # Bind-mounted into the webserver container at /usr/src/paperless/media. Only ensure
  # the directory exists as a mount target — deliberately do NOT manage
  # owner/group/mode here. Once the NFS mount below is in place this path IS the
  # all_squash export (owned by UID 1000, set by the nfs_server play), and a
  # squashed root cannot chown it back to root — re-running would fail with
  # "Operation not permitted".
  ansible.builtin.file:
    path: "{{ paperless_media_dir }}"
    state: directory
    mode: "0770"

- name: Mount the Paperless media subtree from valen's pool over NFSv3
  # Host NFS mount (not a Docker NFS volume) so the generic restic restore copies
  # a restored snapshot back into the pool in place. NFSv3 so the all_squash
  # subtree export is honoured; _netdev defers the mount until the network is up.
  ansible.posix.mount:
    path: "{{ paperless_media_dir }}"
    src: "{{ paperless_nfs_addr }}:{{ paperless_nfs_server_path }}"
    fstype: nfs
    opts: "nfsvers={{ paperless_nfs_version }},rw,_netdev,noatime"
    state: mounted
    boot: true

- name: Create local persistent directories
  # data/ (search index & classification model) and consume/export dirs.
  # Must be writable by container UID/GID (1000).
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ paperless_container_uid }}"
    group: "{{ paperless_container_gid }}"
    mode: "0770"
  loop:
    - "{{ paperless_data_dir }}"
    - "{{ paperless_consume_dir }}"
    - "{{ paperless_export_dir }}"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ paperless_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (DB password, secret key, S3/restic creds)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ paperless_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Start Paperless-ngx stack
  community.docker.docker_compose_v2:
    project_src: "{{ paperless_dir }}"
    state: present
    pull: always
    remove_orphans: true
