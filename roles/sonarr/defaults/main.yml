---
# Fallback defaults for the sonarr role. Production values are set in
# group_vars/sonarr/main.yml and group_vars/media; these keep the role runnable
# standalone and document every variable it consumes.

sonarr_image: "lscr.io/linuxserver/sonarr:4.0.2"

sonarr_dir: /opt/sonarr
sonarr_config_dir: "{{ sonarr_dir }}/config"
sonarr_port: 8989

sonarr_log_max_size: "20m"
sonarr_log_max_file: "3"

# Config backup (restic → Garage S3). See group_vars/sonarr/main.yml for the
# rationale and the vault credentials the sidecar needs.
sonarr_backup_image_version: "v1.4.2"
sonarr_backup_s3_endpoint: "https://s3.jardoole.xyz"
sonarr_backup_s3_region: "garage"
sonarr_backup_s3_bucket: "sonarr-backup"
sonarr_backup_schedule: "0 7 * * *"
sonarr_backup_retention_args: "--keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 1 --prune"

# Note: the shared media_data_root / media_puid / media_pgid / media_time_zone
# vars consumed by this role's templates are provided by group_vars/media (valen
# is in [media]). They are intentionally NOT redefined here — role defaults must
# carry the sonarr_ prefix, and these are fleet-shared, not role-private.
