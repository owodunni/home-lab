---
# Offsite backup mirror — pull valen's Garage buckets into plain restic repos.
#
# Config (dest, endpoint, bucket list, schedule) and the read-only S3 creds come
# from group_vars/backup_mirror. This role only installs the mechanism: rclone,
# its config, the sync script, and a systemd timer. See group_vars/backup_mirror
# /main.yml for the WHAT/WHY, and playbooks/backup-mirror.yml for the key+grants
# that must exist on valen's Garage first.

- name: Pin the Garage S3 hostname to valen's LAN IP in /etc/hosts
  # Beelink is offsite (barn network) and resolves s3.jardoole.xyz via public
  # DNS → Cloudflare, which cannot reach the origin (522). This override sends
  # S3 traffic over the WireGuard tunnel to valen's Traefik instead.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ backup_mirror_garage_host | regex_escape }}$'
    line: "{{ backup_mirror_garage_ip }}  {{ backup_mirror_garage_host }}"
    state: present

- name: Install rclone (the pull engine)
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the offsite mirror destination directory
  # WHAT: world-readable (0755), root-owned. The repo subdirs/files rclone
  #   creates underneath are already 0755/0644, so this top dir was the only
  #   thing gating non-root read.
  # WHY: the workstation offsite-drill (scripts/offsite-drill.sh) restore-tests
  #   the offsite copy by running restic LOCALLY and reading these repos over
  #   SFTP as the SSH login user — keeping the restic password off beelink (the
  #   offsite security model). The repos hold ONLY encrypted restic packs, so
  #   o+rx exposes no plaintext; restic decrypts only on the workstation.
  # RESOLVES: 0700 made the repos unreadable to the SSH user, so an offsite
  #   drill would have needed either restic + the password ON beelink, or a
  #   broad sudo-sftp grant — both worse than reading encrypted packs.
  ansible.builtin.file:
    path: "{{ backup_mirror_dest }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the rclone config directory
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure the node_exporter textfile directory exists
  # The sync script writes its freshness metric here. node_exporter (monitoring
  # layer) owns this dir, but the backup layer runs BEFORE monitoring on a fresh
  # `make site`, so create it defensively — node_exporter only needs to read the
  # .prom file, and it re-applies its own ownership when it installs later.
  ansible.builtin.file:
    path: "{{ backup_mirror_textfile | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the rclone config (read-only key to valen's Garage)
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    owner: root
    group: root
    mode: "0600"  # contains the S3 secret key

- name: Deploy the offsite mirror sync script
  ansible.builtin.template:
    src: backup-mirror-sync.sh.j2
    dest: /usr/local/bin/backup-mirror-sync.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy the offsite mirror systemd service
  ansible.builtin.template:
    src: backup-mirror.service.j2
    dest: /etc/systemd/system/backup-mirror.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Deploy the offsite mirror systemd timer
  ansible.builtin.template:
    src: backup-mirror.timer.j2
    dest: /etc/systemd/system/backup-mirror.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so the timer unit is loaded before enabling it
  ansible.builtin.meta: flush_handlers

- name: Enable and start the offsite mirror timer
  ansible.builtin.systemd:
    name: backup-mirror.timer
    enabled: true
    state: started
