---
# Fallback defaults for the jellyfin role. Production values are set in
# group_vars/jellyfin/main.yml and group_vars/media; these keep the role runnable
# standalone and document every variable it consumes.

jellyfin_image: "lscr.io/linuxserver/jellyfin:10.11.2"

jellyfin_dir: /opt/jellyfin
jellyfin_config_dir: "{{ jellyfin_dir }}/config"
jellyfin_media_dir: "{{ media_data_root }}/media"
jellyfin_port: 8096

# Hardware transcoding — see group_vars/jellyfin/main.yml for the rationale.
# Base /dev/dri passthrough + group_add is always on; the host-driver override
# mounts are off by default.
jellyfin_mount_host_va_drivers: false
jellyfin_va_dri_host: "/usr/lib/x86_64-linux-gnu/dri"
jellyfin_va_libdir_host: "/usr/lib/x86_64-linux-gnu"
jellyfin_va_libmfxgen_host: "/usr/lib/x86_64-linux-gnu/libmfx-gen"
jellyfin_va_igdgmm_host: "/usr/lib/x86_64-linux-gnu/libigdgmm.so.12"

jellyfin_log_max_size: "20m"
jellyfin_log_max_file: "3"

# Config backup (restic → Garage S3). See group_vars/jellyfin/main.yml for the
# rationale and the vault credentials the sidecar needs.
jellyfin_backup_image_version: "v1.4.2"
jellyfin_backup_s3_endpoint: "https://s3.jardoole.xyz"
jellyfin_backup_s3_region: "garage"
jellyfin_backup_s3_bucket: "jellyfin-backup"
jellyfin_backup_schedule: "0 8 * * *"
jellyfin_backup_retention_args: "--keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 1 --prune"

# Note: the shared media_data_root / media_puid / media_pgid / media_time_zone
# vars consumed by this role's templates are provided by group_vars/media (valen
# is in [media]). They are intentionally NOT redefined here — role defaults must
# carry the jellyfin_ prefix, and these are fleet-shared, not role-private.
# The video/render GIDs for group_add come from the local fact
# ansible_local.media_gpu.* set by playbooks/gpu-drivers.yml.
