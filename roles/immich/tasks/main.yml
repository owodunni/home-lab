---
- name: Assert the GPU GIDs fact is present
  # roles/immich needs the video/render GIDs (set by playbooks/gpu-drivers.yml in
  # the system layer) to grant immich-server and immich-machine-learning
  # /dev/dri access via group_add — same requirement as roles/jellyfin. Fail
  # early with a clear message rather than templating an empty group_add that
  # silently loses hardware transcoding/ML acceleration.
  ansible.builtin.assert:
    that:
      - ansible_local.media_gpu.video_gid is defined
      - ansible_local.media_gpu.render_gid is defined
    fail_msg: >-
      Missing ansible_local.media_gpu.{video,render}_gid. Run the system layer
      (playbooks/gpu-drivers.yml) on this host first — it installs the Intel
      drivers and records the GPU GIDs that Immich's group_add needs.

- name: Create Immich stack directory
  # Holds the compose file, .env, the Postgres data dir, and the DB-dump
  # unpack target — not the photo/video originals (those live on the pool,
  # see immich_upload_location below).
  ansible.builtin.file:
    path: "{{ immich_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the Postgres data directory (local NVMe, never the pool)
  # Empty and root-owned; Immich's postgres image (like the stock postgres
  # image it is built from) initializes an empty root-owned data dir itself on
  # first boot — it starts as root, runs initdb as the postgres user, and
  # chowns/chmods 0700 as needed before dropping privileges. Never NFS/pool —
  # see immich_db_data_location's comment in group_vars/immich/main.yml.
  ansible.builtin.file:
    path: "{{ immich_db_data_location }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create the DB-dump unpack directory
  # Written by the immich-unpack sidecar (plain immich.sql), read by the
  # db-backup restic sidecar. Root-owned: both sidecars run as root inside
  # their containers.
  ansible.builtin.file:
    path: "{{ immich_db_dump_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the Immich originals directory on the pool
  # WHAT: the dedicated Immich dir on valen's MergerFS pool that UPLOAD_LOCATION
  #   points at — library/upload/profile/thumbs/encoded-video/backups are all
  #   created by Immich itself under here on first run.
  # WHY these owner/group values: matches the pool's shared media account
  #   (media_puid/media_pgid from group_vars/media) for consistency with the
  #   rest of the pool (design spec "Storage layout"). NOTE: Immich's server
  #   image runs its own process as root (no PUID/PGID env, unlike the
  #   LinuxServer.io images Jellyfin/*arr use) — files Immich itself creates
  #   under this dir will be root-owned regardless of this directory's
  #   ownership. This only sets the top-level directory's ownership.
  ansible.builtin.file:
    path: "{{ immich_upload_location }}"
    state: directory
    owner: "{{ media_puid }}"
    group: "{{ media_pgid }}"
    mode: "0750"

- name: Symlink the originals dir into the compose project for the backup sidecar
  # WHY: the generic restic restore handler (roles/backup_restore/tasks/restic.yml)
  # always copies a restored snapshot back to "{{ backup_compose_dir }}/{{ path }}"
  # — it has no notion of a live path outside compose_dir. UPLOAD_LOCATION lives
  # on the pool, not under immich_dir, so this symlink lets the data-backup
  # sidecar mount (and the restore copy-back land) through a path nested under
  # immich_dir while Docker/cp resolve straight through to the real pool
  # directory. See the "originals" backup entry's comment in
  # group_vars/immich/main.yml for the full rationale.
  ansible.builtin.file:
    path: "{{ immich_dir }}/originals"
    src: "{{ immich_upload_location }}"
    state: link
    force: true

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (DB password, backup S3 keys, restic
  # password).
  ansible.builtin.template:
    src: env.j2
    dest: "{{ immich_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Start Immich stack
  community.docker.docker_compose_v2:
    project_src: "{{ immich_dir }}"
    state: present
    pull: always
    remove_orphans: true
