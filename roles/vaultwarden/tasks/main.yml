---
- name: Create Vaultwarden stack directory
  # Holds the compose file + .env only. Persistent state lives elsewhere: the
  # Postgres data is a local named volume; the Vaultwarden data dir is created
  # below.
  ansible.builtin.file:
    path: "{{ vaultwarden_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the Vaultwarden data directory
  # Bind-mounted into the container at /data (RSA JWT keys, attachments, sends,
  # config.json, icons). The vaultwarden container runs as root and writes here,
  # so root:root is correct. A local host dir (under the stack dir) so the generic
  # restic restore copy-back lands in place — see group_vars/vaultwarden/main.yml.
  ansible.builtin.file:
    path: "{{ vaultwarden_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vaultwarden_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (DB password, OIDC client secret, restic +
  # S3 backup credentials, SMTP password).
  ansible.builtin.template:
    src: env.j2
    dest: "{{ vaultwarden_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Start Vaultwarden stack
  # docker_compose_v2 recreates any service whose resolved config changed (compose
  # or .env), so a re-run picks up config/secret updates without a separate handler.
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_dir }}"
    state: present
    pull: always
    remove_orphans: true
