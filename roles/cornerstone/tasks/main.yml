---
- name: Create Cornerstone stack directory
  # Holds only the compose file + .env. App data lives in the named volume managed
  # by Docker (cornerstone-data) — no host bind needed for the DB (SQLite inside
  # the container).
  ansible.builtin.file:
    path: "{{ cornerstone_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ cornerstone_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (OIDC client secret, backup S3 key,
  # restic password, session secret).
  ansible.builtin.template:
    src: env.j2
    dest: "{{ cornerstone_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Start Cornerstone stack
  community.docker.docker_compose_v2:
    project_src: "{{ cornerstone_dir }}"
    state: present
    pull: always
    remove_orphans: true
