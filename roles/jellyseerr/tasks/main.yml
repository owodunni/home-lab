---
- name: Create Jellyseerr stack directory
  # Holds only the compose file + .env. App settings live in the config bind below.
  ansible.builtin.file:
    path: "{{ jellyseerr_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create Jellyseerr config directory
  # Jellyseerr's /app/config (settings DB). Unlike the LinuxServer.io apps,
  # Jellyseerr takes no PUID/PGID and manages ownership itself (the container
  # writes here as its own user), so the host dir is plain root-owned.
  ansible.builtin.file:
    path: "{{ jellyseerr_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyseerr_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (backup S3 key, restic password).
  ansible.builtin.template:
    src: env.j2
    dest: "{{ jellyseerr_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Start Jellyseerr stack
  community.docker.docker_compose_v2:
    project_src: "{{ jellyseerr_dir }}"
    state: present
    pull: always
    remove_orphans: true
