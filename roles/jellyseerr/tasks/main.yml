---
- name: Create Jellyseerr stack directory
  # Holds only the compose file + .env. App settings live in the config bind below.
  ansible.builtin.file:
    path: "{{ jellyseerr_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create Jellyseerr config directory
  # Seerr's /app/config (settings DB). The container is hardcoded to run as the
  # `node` user (UID/GID 1000) — no PUID/PGID override — and writes here as that
  # user, so the host dir must be owned by 1000:1000. Root ownership (as the old
  # fallenbagel image tolerated) makes seerr fail at startup with
  # "EACCES: permission denied, mkdir '/app/config/logs/'".
  ansible.builtin.file:
    path: "{{ jellyseerr_config_dir }}"
    state: directory
    owner: "{{ jellyseerr_config_uid }}"
    group: "{{ jellyseerr_config_gid }}"
    mode: "0750"
    recurse: true

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyseerr_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (backup S3 key, restic password).
  ansible.builtin.template:
    src: env.j2
    dest: "{{ jellyseerr_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Start Jellyseerr stack
  community.docker.docker_compose_v2:
    project_src: "{{ jellyseerr_dir }}"
    state: present
    pull: always
    remove_orphans: true
