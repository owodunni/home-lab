---
# Fallback defaults for the jellyseerr role. Production values are set in
# group_vars/jellyseerr/main.yml and group_vars/media; these keep the role
# runnable standalone and document every variable it consumes.

jellyseerr_image: "fallenbagel/jellyseerr:2.7.3"

jellyseerr_dir: /opt/jellyseerr
jellyseerr_config_dir: "{{ jellyseerr_dir }}/config"
jellyseerr_port: 5055
jellyseerr_log_level: "info"

jellyseerr_log_max_size: "20m"
jellyseerr_log_max_file: "3"

# Config backup (restic → Garage S3). See group_vars/jellyseerr/main.yml for the
# rationale and the vault credentials the sidecar needs.
jellyseerr_backup_image_version: "v1.4.2"
jellyseerr_backup_s3_endpoint: "https://s3.jardoole.xyz"
jellyseerr_backup_s3_region: "garage"
jellyseerr_backup_s3_bucket: "jellyseerr-backup"
jellyseerr_backup_schedule: "0 9 * * *"
jellyseerr_backup_retention_args: "--keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 1 --prune"

# Note: the shared media_time_zone var consumed by this role's templates is
# provided by group_vars/media (valen is in [media]). It is intentionally NOT
# redefined here — role defaults must carry the jellyseerr_ prefix, and it is
# fleet-shared, not role-private. Jellyseerr is not a LinuxServer.io image, so it
# takes no PUID/PGID (it manages /app/config itself).
