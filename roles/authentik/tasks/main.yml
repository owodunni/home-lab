---
- name: Create Authentik root and config directories
  ansible.builtin.file:
    path: "{{ authentik_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - ""
    - certs

- name: Create Authentik data directories
  # Authentik server container runs as UID 1000; these dirs are bind-mounted
  # into the container so they must be readable/writable by that user.
  ansible.builtin.file:
    path: "{{ authentik_dir }}/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - media
    - custom-templates

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (PG_PASS, AUTHENTIK_SECRET_KEY)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ authentik_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Start Authentik stack
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_dir }}"
    state: present
    pull: always
    remove_orphans: true
