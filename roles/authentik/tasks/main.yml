---
- name: Create Authentik directory tree
  ansible.builtin.file:
    path: "{{ authentik_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - ""
    - media
    - certs
    - custom-templates

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Template .env file
  # Mode 0600: contains vault secrets (PG_PASS, AUTHENTIK_SECRET_KEY)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ authentik_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Pull Authentik images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ authentik_dir }}"

- name: Start Authentik stack
  community.docker.docker_compose_v2:
    project_src: "{{ authentik_dir }}"
    state: present
    remove_orphans: true
