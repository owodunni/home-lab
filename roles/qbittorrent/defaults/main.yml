---
# Fallback defaults for the qbittorrent role. Production values are set in
# group_vars/qbittorrent/main.yml and group_vars/media; these keep the role
# runnable standalone and document every variable it consumes.

qbittorrent_image: "lscr.io/linuxserver/qbittorrent:5.1.4"
qbittorrent_gluetun_image: "ghcr.io/qdm12/gluetun:v3.41.0"
qbittorrent_port_manager_image: "snoringdragon/gluetun-qbittorrent-port-manager:1.3"

qbittorrent_dir: /opt/qbittorrent
qbittorrent_config_dir: "{{ qbittorrent_dir }}/config"
qbittorrent_port: 8080
qbittorrent_admin_user: "admin"

qbittorrent_vpn_countries: "Sweden"
qbittorrent_vpn_dns: "9.9.9.9"
qbittorrent_docker_subnet: "172.28.0.0/16"
# home_lan_subnet is a fleet-wide var (group_vars/all), always in scope — don't
# re-hardcode the LAN CIDR here (it is centralized there on purpose).
qbittorrent_vpn_outbound_subnets: "{{ qbittorrent_docker_subnet }},{{ home_lan_subnet }}"

qbittorrent_log_max_size: "20m"
qbittorrent_log_max_file: "3"

# Note: the shared media_data_root / media_puid / media_pgid / media_time_zone
# vars consumed by this role's templates are provided by group_vars/media (valen
# is in [media]). They are intentionally NOT redefined here — role defaults must
# carry the qbittorrent_ prefix, and these are fleet-shared, not role-private.
