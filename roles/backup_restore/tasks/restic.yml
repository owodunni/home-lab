---
# Restore handler — type: restic. Restores a chosen snapshot (default: latest)
# into a scratch dir, then copies each path back over the live volume. The play
# has already stopped the consumer services that read these dirs.
#
# Snapshot selection: backup_targets[<backup.name>] picks an older snapshot ID
# (from `make verify-backups` / the listing below); absent → "latest". This is
# what lets the operator roll back to a good state from weeks ago, not just the
# newest snapshot.

- name: "Resolve restore target for {{ backup.name }}"
  ansible.builtin.set_fact:
    backup_restore_target: "{{ (backup_targets | default({}))[backup.name] | default('latest') }}"

- name: "List restic snapshots before restore for {{ backup.name }}"
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - "{{ backup.compose_service }}"
      - restic
      - snapshots
      - --json
    chdir: "{{ backup.compose_dir }}"
  register: backup_restore_restic_snaps
  changed_when: false

- name: "List available restore points (restoring backup_restore_target) for {{ backup.name }}"
  ansible.builtin.debug:
    msg: "{{ item.short_id }}  {{ item.time }}"
  loop: "{{ backup_restore_restic_snaps.stdout | from_json }}"
  loop_control:
    label: "{{ item.short_id }}"

- name: "Restore the selected snapshot into a scratch dir for {{ backup.name }}"
  # The live volume mounts are read-only inside the sidecar, and a plain --rm
  # container's filesystem is ephemeral, so restore into an explicitly
  # bind-mounted host dir (.restore) we can read back from the host afterwards.
  # restic recreates the original source paths, so files land under
  # .restore/data/<path>.
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - run
      - --rm
      - -v
      - "{{ backup.compose_dir }}/.restore:/restore"
      - "{{ backup.compose_service }}"
      - restic
      - restore
      - "{{ backup_restore_target }}"
      - --target
      - /restore
    chdir: "{{ backup.compose_dir }}"
  changed_when: true

- name: "Copy each restored path back over the live volume for {{ backup.name }}"
  ansible.builtin.command:
    cmd: "cp -a {{ backup.compose_dir }}/.restore/data/{{ item }}/. {{ backup.compose_dir }}/{{ item }}/"
  loop: "{{ backup.restore_paths }}"
  changed_when: true

- name: "Remove the scratch restore dir for {{ backup.name }}"
  ansible.builtin.file:
    path: "{{ backup.compose_dir }}/.restore"
    state: absent
