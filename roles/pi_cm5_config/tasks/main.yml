---
# Pi CM5 configuration tasks - using geerlingguy's elegant lineinfile pattern
# Simple, variable-driven approach for maximum flexibility

# What: Snapshot the pristine config.txt to a fixed `.orig` file, once.
# Why: Two causes made this report "changed" on every run: (1) the dest used
#   ansible_date_time.epoch so a new file was written each run — fixed with a
#   stable `.orig` name + force=false (copy only when absent); (2) /boot/firmware
#   is FAT32, which cannot store Unix permissions, so an explicit `mode` could
#   never persist and copy re-applied it forever — fixed by omitting mode, the
#   same approach the lineinfile tasks below use.
# Resolves: Role reporting a spurious change on every run (always-backup noise).
- name: Backup original config.txt if backup enabled
  ansible.builtin.copy:
    src: "{{ pi_cm5_config_config_file }}"
    dest: "{{ pi_cm5_config_config_file }}.orig"
    remote_src: true
    force: false
  when:
    - pi_cm5_config_backup_enabled | default(true)
    - not ansible_check_mode
  register: pi_cm5_config_backup_result
  tags:
    - pi-cm5-config
    - backup

- name: Configure base Pi CM5 settings in config.txt
  ansible.builtin.lineinfile:
    dest: "{{ pi_cm5_config_config_file }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertafter: EOF
    state: present
    create: true
    # Note: Intentionally not setting mode to preserve RPi OS default permissions
    # ansible-lint risky-file-permissions can be ignored here
  with_items: "{{ pi_cm5_config_base_config }}"
  notify: reboot required
  tags:
    - pi-cm5-config
    - base-settings

- name: Configure Pi CM5 power optimization settings
  ansible.builtin.lineinfile:
    dest: "{{ pi_cm5_config_config_file }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertafter: EOF
    state: present
  with_items: "{{ pi_cm5_config_power_config }}"
  notify: reboot required
  tags:
    - pi-cm5-config
    - power-optimization

- name: Configure Pi CM5 PCIe settings
  ansible.builtin.lineinfile:
    dest: "{{ pi_cm5_config_config_file }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertafter: EOF
    state: present
  with_items: "{{ pi_cm5_config_pcie_config }}"
  notify: reboot required
  tags:
    - pi-cm5-config
    - pcie-settings

- name: Configure Pi CM5 POE settings
  ansible.builtin.lineinfile:
    dest: "{{ pi_cm5_config_config_file }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertafter: EOF
    state: present
  with_items: "{{ pi_cm5_config_poe_config }}"
  notify: reboot required
  tags:
    - pi-cm5-config
    - poe-settings

# What: Snapshot the pristine cmdline.txt to a fixed `.orig` file, once.
# Why: Same fix as the config.txt backup above — an epoch-suffixed dest created a
#   new file every run and always reported "changed". force=false keeps the
#   original captured exactly once; mode is omitted because /boot/firmware is
#   FAT32 and cannot persist Unix permissions (would report changed forever).
# Resolves: Spurious change reported on every run for cgroup-enabled nodes.
- name: Create manual backup of cmdline.txt before cgroup changes
  ansible.builtin.copy:
    src: "{{ pi_cm5_config_cmdline_file }}"
    dest: "{{ pi_cm5_config_cmdline_file }}.orig"
    remote_src: true
    force: false
  when:
    - pi_cm5_config_cgroup_enabled | default(false)
    - not ansible_check_mode
  tags:
    - pi-cm5-config
    - cgroup-settings

- name: Enable cgroups for Kubernetes in cmdline.txt
  ansible.builtin.replace:
    path: "{{ pi_cm5_config_cmdline_file }}"
    regexp: '^((?!.*cgroup_memory=1)(?!.*cgroup_enable=memory).*)$'
    replace: '\1 cgroup_memory=1 cgroup_enable=memory'
    backup: false
  when: pi_cm5_config_cgroup_enabled | default(false)
  notify: reboot required
  tags:
    - pi-cm5-config
    - cgroup-settings
