---
# Verify handler — type: postgres (a pg_dump captured in a restic repo).
#
# The DB dump is snapshotted by restic exactly like the file volumes, so its
# verification is identical: list snapshots, show the restore points, and assert
# the newest is fresh. Delegate to the shared restic verifier rather than
# duplicate it — the only difference between `postgres` and `restic` is how they
# RESTORE (pg_restore vs file copy-back), not how they verify.
#
# Contract a type handler must satisfy: given `backup` (one manifest entry),
# fail the play if a usable, fresh backup is not present; otherwise stay green.

- name: "Verify the DB restic repo for {{ backup.name }}"
  ansible.builtin.include_tasks: restic.yml
