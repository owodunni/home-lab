---
# Verify that a service's backups exist and are fresh — non-destructive.
#
# Usage:
#   make verify-backups SERVICE=authentik
#   # or directly:
#   ansible-playbook playbooks/verify-backups.yml -e backup_service=authentik
#
# Targets the host(s) in the named service group, so that service's group_vars
# (including its `backups` manifest) are in scope. The backup_verify role loops
# the manifest and asserts each backup is present and within its freshness
# window; a stale or missing backup fails the play with a clear message.
#
# Safe to run anytime, including from cron before a risky change. See CLAUDE.md
# → "Backups: verify & restore" and docs/backup-recovery-testing.md.

- name: Verify backups for a service
  # Set at runtime via -e backup_service=<group> (see Makefile verify-backups).
  # The default is a placeholder group that matches no host, so `--syntax-check`
  # passes and a forgotten -e is a safe no-op rather than an error.
  hosts: "{{ backup_service | default('undefined_service_group') }}"
  become: true
  gather_facts: false
  roles:
    - role: backup_verify
