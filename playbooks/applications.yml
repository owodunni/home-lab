---
# Applications layer
#
# What: Deploys end-user application services that sit on top of the full
#       platform (ingress, Docker, storage/NFS, and identity): Nextcloud file
#       sync/share, and the media (arr) stack on valen.
# Why:  These services depend on everything below them — Traefik for ingress,
#       Docker for runtime, the storage pool/NFS for bulk data, and (for SSO)
#       Authentik. They are sequenced after `auth` so any OIDC integration can
#       target a live identity provider, per the architecture note in CLAUDE.md.
#       Their non-service foundations live in earlier layers: the media data
#       tree is provisioned in `storage`, the Intel GPU drivers in `system`.
# Resolves: A place for user-facing apps that must run after auth, holding only
#           actual services (and their auth middleware) — host hardware and
#           storage layout are split out into the layers that own them.
#
# Pure orchestration: no logic here, only imports of standalone function
# playbooks.

# AdGuard Home filtering DNS. Independent of the other apps — its only hard
# dependency is Docker (service-infra), and it needs neither ingress nor auth
# (UI is loopback-only). Kept here as a normal application service for the
# one-line-move + `make app service=adguard` ergonomics.
- name: Deploy AdGuard Home filtering DNS
  ansible.builtin.import_playbook: adguard.yml

- name: Deploy Nextcloud file sync/share
  ansible.builtin.import_playbook: nextcloud.yml

- name: Deploy Vaultwarden password manager
  ansible.builtin.import_playbook: vaultwarden.yml

- name: Deploy Paperless-ngx document management
  ansible.builtin.import_playbook: paperless.yml

- name: Deploy Cornerstone home management
  ansible.builtin.import_playbook: cornerstone.yml

# Mailcow self-hosted email. Independent of the media stack; placed after
# Vaultwarden as another standalone app on top of the platform (ingress,
# Docker, Garage, Authentik) — see
# docs/superpowers/specs/2026-07-25-mailcow-email-design.md.
- name: Deploy mailcow self-hosted email
  ansible.builtin.import_playbook: mailcow.yml

# --- Media stack (on valen) -------------------------------------------------
# Storage tree (storage layer) and GPU drivers (system layer) are already in
# place; here we set up the shared foundations (the cross-stack Docker network,
# then the SSO middleware), then the services in dependency order — one at a
# time, each validated before the next is added. See docs/media-stack-migration.md.
- name: Media — shared Docker network
  ansible.builtin.import_playbook: media-network.yml

- name: Media — Authentik forward-auth middleware
  ansible.builtin.import_playbook: media-forward-auth.yml

- name: Media — qBittorrent (+ Gluetun VPN) download client
  ansible.builtin.import_playbook: qbittorrent.yml

- name: Media — Prowlarr indexer/tracker manager
  ansible.builtin.import_playbook: prowlarr.yml

- name: Media — Radarr movie collection manager
  ansible.builtin.import_playbook: radarr.yml

- name: Media — Sonarr TV series manager
  ansible.builtin.import_playbook: sonarr.yml

- name: Media — Unpackerr archive extractor (Radarr + Sonarr)
  ansible.builtin.import_playbook: unpackerr.yml

- name: Media — Jellyfin media server (QuickSync transcoding)
  ansible.builtin.import_playbook: jellyfin.yml

- name: Media — Jellyseerr request/discovery UI
  ansible.builtin.import_playbook: jellyseerr.yml

- name: Media — Jellyfin barn relay (beelink -> valen over WireGuard)
  ansible.builtin.import_playbook: jellyfin-relay.yml

# Immich self-hosted photo/video management (Google Photos replacement) — on
# valen, after the media stack. Independent of the *arr apps (no shared data),
# placed last among the apps because it needs Authentik OIDC live (auth layer,
# already satisfied by this point) and is the newest/last-planned service. See
# docs/superpowers/specs/2026-07-25-immich-deployment-design.md.
- name: Deploy Immich photo/video management
  ansible.builtin.import_playbook: immich.yml

# SilverBullet markdown wiki (multi-space mode, OIDC SSO against Authentik) — on
# valen, behind the co-located Traefik. Independent of the media stack; placed
# last among the apps as the newest service. Needs Authentik live (auth layer,
# already satisfied by this point). NOTE: only the container/route/backup wiring
# is automated — the account, space, and OIDC-provider setup happens in
# SilverBullet's web Dashboard (upstream offers no env/config path); see
# docs/silverbullet.md for the first-run runbook.
- name: Deploy SilverBullet wiki
  ansible.builtin.import_playbook: silverbullet.yml
