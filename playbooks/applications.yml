---
# Applications layer
#
# What: Deploys end-user application services that sit on top of the full
#       platform (ingress, Docker, storage/NFS, and identity): Seafile file
#       sync/share, and the media (arr) stack on valen.
# Why:  These services depend on everything below them — Traefik for ingress,
#       Docker for runtime, the storage pool/NFS for bulk data, and (for SSO)
#       Authentik. They are sequenced after `auth` so any OIDC integration can
#       target a live identity provider, per the architecture note in CLAUDE.md.
#       Their non-service foundations live in earlier layers: the media data
#       tree is provisioned in `storage`, the Intel GPU drivers in `system`.
# Resolves: A place for user-facing apps that must run after auth, holding only
#           actual services (and their auth middleware) — host hardware and
#           storage layout are split out into the layers that own them.
#
# Pure orchestration: no logic here, only imports of standalone function
# playbooks.
- name: Deploy Seafile file sync/share
  ansible.builtin.import_playbook: seafile.yml

# --- Media stack (on valen) -------------------------------------------------
# Storage tree (storage layer) and GPU drivers (system layer) are already in
# place; here we deploy the SSO middleware, then the services in dependency
# order — one at a time, each validated before the next is added.
# See docs/media-stack-migration.md.
- name: Media — Authentik forward-auth middleware
  ansible.builtin.import_playbook: media-forward-auth.yml

- name: Media — qBittorrent (+ Gluetun VPN) download client
  ansible.builtin.import_playbook: qbittorrent.yml

- name: Media — Prowlarr indexer/tracker manager
  ansible.builtin.import_playbook: prowlarr.yml

- name: Media — Radarr movie collection manager
  ansible.builtin.import_playbook: radarr.yml

- name: Media — Sonarr TV series manager
  ansible.builtin.import_playbook: sonarr.yml

- name: Media — Jellyfin media server (QuickSync transcoding)
  ansible.builtin.import_playbook: jellyfin.yml

- name: Media — Jellyseerr request/discovery UI
  ansible.builtin.import_playbook: jellyseerr.yml
