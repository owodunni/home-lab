---
# Deploy Grafana Alloy log shipper on every fleet host.
#
# What: Installs Grafana Alloy (grafana.grafana.alloy) on [all] hosts — the
#       log-side twin of node_exporter. Each agent tails host journald
#       everywhere and Docker container logs on hosts that run Docker, pushing
#       both to Loki at loki.jardoole.xyz over TLS + basic-auth. The River config
#       and version pin live in group_vars/all/main.yml (alloy_config).
# Why:  node_exporter/cadvisor detect a container or host down, not an app that
#       is Up while malfunctioning internally — the Jellyseerr DNS failure lived
#       only in the container's logs. Alloy is how those logs reach Loki so the
#       ruler can alert on fatal patterns.
# Resolves: no host/container log collection across the fleet.
#
# Prerequisites:
#   - Loki reachable at loki.jardoole.xyz (playbooks/loki.yml). Ordering is not
#     strict: Alloy's WAL buffers until Loki is up, so a first run before Loki
#     exists self-heals (beelink's flaky WireGuard link relies on the same WAL).
#   - group_vars/all/vault.yml: vault_loki_push_password — the shared basic-auth
#     password Alloy presents to Loki's push route (paired with the htpasswd hash
#     in the Traefik middleware, group_vars/monitoring/vault.yml).

- name: Deploy Grafana Alloy on all hosts
  hosts: all
  become: true

  roles:
    - role: grafana.grafana.alloy

  tasks:
    - name: Pin the Loki push hostname to the monitoring host's LAN IP (offsite peers)
      # What: on WireGuard (offsite) hosts only, pin loki.<domain> -> the
      #   monitoring host's LAN IP in /etc/hosts.
      # Why: offsite peers (beelink, at the barn) do NOT use the home router's
      #   split-horizon DNS, so loki.<domain> resolves to the public Cloudflare
      #   record and the Alloy push times out — Cloudflare has no origin for this
      #   LAN-only service. Pinning to the LAN IP sends the push over WireGuard
      #   straight to pi-cm5-1's Traefik; TLS still validates because the hostname
      #   matches the wildcard ACME cert. Exactly mirrors the backup_mirror role's
      #   s3.<domain> -> valen pin (roles/backup_mirror/tasks/main.yml).
      # Resolves: beelink shipping zero logs (Alloy push Client.Timeout).
      # LAN hosts skip this: the Ubiquiti resolver already maps loki.<domain> to
      #   the same IP for them. The monitoring host's IP is read from its gathered
      #   facts (this play targets all, so those facts are present).
      when: "'wireguard' in group_names"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\sloki\.{{ traefik_domain | regex_escape }}$'
        line: "{{ hostvars[groups['monitoring'][0]]['ansible_default_ipv4']['address'] }}  loki.{{ traefik_domain }}"
