---
# Storage layer
#
# What: Brings storage hosts from raw drives to a fully encrypted, pooled,
#       parity-protected storage server. Runs only on the [storage] group.
# Why:  Storage setup is a distinct phase from base OS (system layer) and
#       hardening (security layer): it depends on both being complete first
#       (up-to-date packages, secure baseline) but is only relevant for hosts
#       that carry HDDs/NVMe drives.
# Resolves: The need to run disk encryption and storage software setup as an
#           ordered unit without coupling them to the Pi-specific system layer.
#
# Order matters: disk-encrypt must run before snapraid-mergerfs because
# snapraid-mergerfs expects LUKS devices to already be open. media-storage runs
# next: it builds the media data tree on the now-mounted pool (owned by the
# media account snapraid-mergerfs creates) — it is storage layout, not a
# service, so it belongs in this layer rather than with the media apps that
# consume it via local bind mounts. nfs runs after, exporting the pool. disk-
# spindown runs last since it only tunes power management on the mounted drives.
#
# Pure orchestration: no logic here, only imports of standalone function
# playbooks.
- name: Set up LUKS encryption on storage drives
  ansible.builtin.import_playbook: disk-encrypt.yml

- name: Configure MergerFS + SnapRAID storage pool
  ansible.builtin.import_playbook: snapraid-mergerfs.yml

- name: Provision the media data tree on the pool
  ansible.builtin.import_playbook: media-storage.yml

- name: Export the storage pool over NFS
  ansible.builtin.import_playbook: nfs.yml

- name: Configure HDD spin-down
  ansible.builtin.import_playbook: disk-spindown.yml
