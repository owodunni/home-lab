---
# Deploy Cornerstone (home management — inventory, financials, diary) and
# register its Traefik route.
#
# What: Provisions the backup bucket/key on Garage (valen), then deploys the
#       Cornerstone stack on [cornerstone] (valen) and registers the
#       cornerstone.jardoole.xyz route with the co-located Traefik.
# Why:  Self-hosted home management with SQLite persistence, Authentik OIDC
#       SSO, and Paperless-ngx document integration — all backed by the shared
#       Garage S3 backup infrastructure.
# Resolves: Automated, reliable deployment of Cornerstone.
#
# Prerequisites:
#   - Docker runtime on valen (service-infra layer).
#   - Traefik running with conf.d at /etc/traefik/conf.d (ingress layer).
#   - Garage up on [garage] (service-infra layer) — first play provisions the
#     backup bucket/key there.
#   - Authentik live (auth layer) with an OAuth2/OpenID Provider + Application
#     for Cornerstone. Redirect URI must be registered as:
#       https://cornerstone.jardoole.xyz/api/auth/oidc/callback
#   - Paperless-ngx deployed (paperless.yml) on pi-cm5-2. Cornerstone runs on
#     valen, so it does NOT reach it over loopback: the server-side API calls go
#     to https://paperless.jardoole.xyz over the LAN, which requires the AdGuard
#     rewrite for paperless to be in place. See cornerstone_paperless_url.
#
# Vault vars required in group_vars/cornerstone/vault.yml:
#   vault_cornerstone_session_secret        — openssl rand -base64 32
#   vault_cornerstone_oidc_client_secret    — from the Authentik application
#   vault_cornerstone_paperless_api_token   — Paperless Settings → API Token
#   vault_cornerstone_restic_password       — openssl rand -base64 32
#                                             LOSING IT = snapshots unrecoverable
#   vault_cornerstone_backup_s3_access_key / _secret_key
#     — scripts/garage-keygen.sh vault_cornerstone_backup_s3

- name: Provision the Cornerstone backup bucket and key on Garage
  # Runs on the Garage host (valen) because the `garage` CLI lives there. Kept
  # in this service playbook so backup provisioning travels with the service.
  # Garage is already up (service-infra precedes applications). Every check
  # short-circuits on re-runs.
  hosts: garage
  become: true
  vars:
    _cornerstone_host: "{{ groups['cornerstone'][0] }}"
    _bucket: "{{ hostvars[_cornerstone_host]['cornerstone_backup_s3_bucket'] }}"
    _access_key: "{{ hostvars[_cornerstone_host]['vault_cornerstone_backup_s3_access_key'] }}"
    _secret_key: "{{ hostvars[_cornerstone_host]['vault_cornerstone_backup_s3_secret_key'] }}"
  tasks:
    - name: List existing Garage buckets
      ansible.builtin.command:
        cmd: garage bucket list
      register: garage_bucket_list
      changed_when: false

    - name: Create the Cornerstone backup bucket
      when: _bucket not in garage_bucket_list.stdout
      ansible.builtin.command:
        cmd: garage bucket create {{ _bucket }}
      changed_when: true

    - name: List existing Garage API keys
      ansible.builtin.command:
        cmd: garage key list
      register: garage_key_list
      changed_when: false

    - name: Import the vaulted backup API key
      # Bring-your-own creds so a rebuilt Garage accepts the same key with no
      # manual step. --yes bypasses the confirmation prompt.
      when: _bucket not in garage_key_list.stdout
      ansible.builtin.command:
        cmd: >
          garage key import --yes
          -n {{ _bucket }}
          {{ _access_key }}
          {{ _secret_key }}
      no_log: true  # secret key is on the command line
      changed_when: true

    - name: Read current grants on the backup bucket
      ansible.builtin.command:
        cmd: garage bucket info {{ _bucket }}
      register: garage_bucket_info
      changed_when: false

    - name: Grant the key read/write access to its backup bucket
      # Gated on the actual grant state (not key import) so a failed/interrupted
      # grant re-runs cleanly rather than leaving a valid key with no bucket access.
      when: _access_key not in garage_bucket_info.stdout
      ansible.builtin.command:
        cmd: >
          garage bucket allow
          {{ _bucket }}
          --read --write
          --key {{ _access_key }}
      changed_when: true

- name: Deploy Cornerstone and register its Traefik route
  hosts: cornerstone
  become: true

  roles:
    - role: cornerstone

  tasks:
    - name: Deploy Traefik routing config for Cornerstone
      ansible.builtin.template:
        src: templates/traefik-cornerstone.yml.j2
        dest: /etc/traefik/conf.d/cornerstone.yml
        owner: traefik
        group: traefik
        mode: "0640"
