---
# Deploy Authentik (PostgreSQL + Redis + server + worker) as a docker-compose
# stack and register the auth.jardoole.xyz route with Traefik.
#
# Prerequisites:
#   - Docker runtime (service-infra layer)
#   - Traefik running with conf.d at /etc/traefik/conf.d (ingress layer)
#   - Garage installed and running on the [garage] host (services layer, which
#     site.yml runs before auth — see CLAUDE.md ordering). The first play below
#     needs the `garage` CLI to provision the backup bucket/key.
#
# Vault vars required in group_vars/authentik/vault.yml:
#   vault_authentik_pg_pass
#   vault_authentik_secret_key
#   vault_authentik_backup_s3_access_key  — Garage access key, "GK" + 24 hex chars
#   vault_authentik_backup_s3_secret_key  — Garage secret, 64 hex chars
#   vault_authentik_volumes_backup_s3_access_key / _secret_key — same format,
#     a separate key pair for the volumes-backup (restic) sidecar's bucket
#   vault_authentik_restic_password — restic repo encryption password
#     (openssl rand -base64 32); losing it makes existing snapshots unrecoverable
#     Generate the two S3 key pairs yourself before first run (no copy-paste from
#     a created key):
#       scripts/garage-keygen.sh vault_authentik_backup_s3
#       scripts/garage-keygen.sh vault_authentik_volumes_backup_s3
#     The play below imports them into Garage; the deploy play feeds the same
#     values to the pg-backup and volumes-backup sidecars. One source of truth,
#     fully unattended.

- name: Provision Authentik backup buckets and keys on Garage
  # Runs on the Garage host (beelink) because the `garage` CLI lives there, and
  # in the auth layer (not the services/garage layer) so backup provisioning and
  # consumption travel with the Authentik service. Garage is already up by now
  # (services layer precedes auth). All checks short-circuit on subsequent runs.
  hosts: garage
  become: true
  vars:
    # Single source of truth: bucket names and credentials live with the
    # Authentik service in group_vars/authentik, pulled here via the
    # [authentik] group so this play needs no edit when Authentik moves hosts.
    _authentik_host: "{{ groups['authentik'][0] }}"
    _garage_resources:
      - bucket: "{{ hostvars[_authentik_host]['authentik_backup_s3_bucket'] }}"
        access_key: "{{ hostvars[_authentik_host]['vault_authentik_backup_s3_access_key'] }}"
        secret_key: "{{ hostvars[_authentik_host]['vault_authentik_backup_s3_secret_key'] }}"
      - bucket: "{{ hostvars[_authentik_host]['authentik_volumes_backup_s3_bucket'] }}"
        access_key: "{{ hostvars[_authentik_host]['vault_authentik_volumes_backup_s3_access_key'] }}"
        secret_key: "{{ hostvars[_authentik_host]['vault_authentik_volumes_backup_s3_secret_key'] }}"
  tasks:
    - name: List existing Garage buckets
      ansible.builtin.command:
        cmd: garage bucket list
      register: garage_bucket_list
      changed_when: false

    - name: Create Authentik backup buckets
      # Idempotent: only runs when the bucket does not yet exist
      when: item.bucket not in garage_bucket_list.stdout
      ansible.builtin.command:
        cmd: garage bucket create {{ item.bucket }}
      loop: "{{ _garage_resources }}"
      loop_control:
        label: "{{ item.bucket }}"
      changed_when: true

    - name: List existing Garage API keys
      ansible.builtin.command:
        cmd: garage key list
      register: garage_key_list
      changed_when: false

    - name: Import the vaulted backup API keys
      # Idempotent: only runs when the key (matched by name) does not yet exist.
      # Bring-your-own creds so a rebuilt Garage accepts the same key with no
      # manual step. Garage validates the format (GK+24 hex / 64 hex); --yes
      # bypasses the interactive confirmation guard on import.
      when: item.bucket not in garage_key_list.stdout
      ansible.builtin.command:
        cmd: >
          garage key import --yes
          -n {{ item.bucket }}
          {{ item.access_key }}
          {{ item.secret_key }}
      loop: "{{ _garage_resources }}"
      loop_control:
        label: "{{ item.bucket }}"
      no_log: true  # secret key is on the command line
      changed_when: true

    - name: Read current grants on each backup bucket
      # Drives the grant step below. `garage bucket info` lists the access key IDs
      # that currently have permissions on the bucket under "KEYS FOR THIS BUCKET".
      ansible.builtin.command:
        cmd: garage bucket info {{ item.bucket }}
      loop: "{{ _garage_resources }}"
      loop_control:
        label: "{{ item.bucket }}"
      register: garage_bucket_info
      changed_when: false

    - name: Grant key read/write access to its backup bucket
      # WHAT: grant the key RW on its bucket whenever it is not already listed in
      #   that bucket's grants.
      # WHY: the grant MUST be decoupled from key existence. A prior version gated
      #   this on `item.bucket not in garage_key_list.stdout` — the same guard as
      #   the key import — so once the key existed the grant could never re-run. If
      #   the grant ever failed (or an interrupted run imported the key before
      #   granting), re-running the play skipped it forever, leaving a valid key
      #   with no bucket access.
      # RESOLVES: silent "Stat: Access Denied" / "create key in repository failed"
      #   in the pg-backup and volumes-backup sidecars — backups appeared deployed
      #   but never wrote a single object. Keying off the actual grant state makes
      #   this idempotent and self-healing.
      # Bucket is a positional arg here (unlike `garage key import -n`, which takes
      # a flag) — `garage bucket allow <bucket> --read --write --key <key>`.
      when: item.item.access_key not in item.stdout
      ansible.builtin.command:
        cmd: >
          garage bucket allow
          {{ item.item.bucket }}
          --read --write
          --key {{ item.item.access_key }}
      loop: "{{ garage_bucket_info.results }}"
      loop_control:
        label: "{{ item.item.bucket }}"
      changed_when: true

- name: Deploy Authentik identity provider
  hosts: authentik
  become: true

  roles:
    - role: authentik

  tasks:
    - name: Deploy Traefik routing config for Authentik
      ansible.builtin.template:
        src: templates/traefik-authentik.yml.j2
        dest: /etc/traefik/conf.d/authentik.yml
        owner: traefik
        group: traefik
        mode: "0640"
