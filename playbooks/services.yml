---
# Services layer
#
# What: Deploys application services that use the ingress layer for HTTPS
#       termination. Currently: Garage S3-compatible object storage on all
#       [ingress] group hosts.
# Why:  Services depend on both storage (MergerFS pool must be mounted) and
#       ingress (Traefik must be running before app routing configs land). This
#       layer encodes that dependency in the site.yml ordering.
# Resolves: An ordered composition layer between infrastructure (storage, ingress)
#           and hardening (security).
#
# Order: After ingress (Traefik must be running before conf.d routing files land).
#        Before security (hardening runs last).

- name: Services | Garage S3 object storage
  ansible.builtin.import_playbook: garage.yml
