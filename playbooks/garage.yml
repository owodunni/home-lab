---
# Install and configure Garage S3-compatible object storage
#
# What: Deploys Garage via the zorun.garage role (binary + user + systemd service),
#       then does a one-time cluster layout initialization and drops a Traefik
#       dynamic config so s3.jardoole.xyz routes to the Garage S3 API with TLS.
# Why:  MinIO moved to BUSL (non-OSS). Garage is a lightweight, self-hostable
#       S3-compatible alternative well-suited to single-node setups backed by
#       SnapRAID/MergerFS.
# Resolves: An S3-compatible object store on beelink with HTTPS termination via
#           the ingress layer.
#
# Prerequisites:
#   - Traefik (ingress layer) must already be running
#   - MergerFS pool at {{ mergerfs_mount_point }} must be mounted (storage layer)
#   - vault_garage_rpc_secret and vault_garage_admin_token in host_vars/beelink/vault.yml
#
# Idempotency: `garage status` is retried until Garage is up. The layout
#              assign/apply block is keyed off `garage layout show` reporting
#              "Current cluster layout version: 0" — the zone label appears in
#              `garage status` as soon as a role is *staged*, even if `apply`
#              never ran, so checking for it there left the layout permanently
#              stuck at version 0 ("Layout not ready" on every bucket/key op)
#              if a prior run staged but didn't apply.

- name: Install and configure Garage object storage
  hosts: garage
  become: true

  roles:
    - role: zorun.garage

  tasks:
    - name: Wait for Garage to be responsive
      ansible.builtin.command:
        cmd: garage status
      register: garage_status
      retries: 10
      delay: 3
      until: garage_status.rc == 0
      changed_when: false

    - name: Check cluster layout version
      ansible.builtin.command:
        cmd: garage layout show
      register: garage_layout
      changed_when: false

    - name: Initialize single-node cluster layout
      # Version 0 means no layout has ever been applied — either first install,
      # or a prior run staged a role (assign) but didn't reach apply. Re-running
      # assign with the same params is idempotent, so it's safe to redo both
      # steps whenever the applied version is still 0.
      when: "'Current cluster layout version: 0' in garage_layout.stdout"
      block:
        - name: Get local node ID
          ansible.builtin.command:
            cmd: garage node id
          register: garage_node_id
          changed_when: false

        - name: Assign node to layout
          # -z: zone/datacenter label (arbitrary for single-node)
          # -c: advertised capacity (1T; informational only for replication_factor=1)
          # stdout_lines | last: skip any diagnostic banner lines in garage node id output
          ansible.builtin.command:
            cmd: >
              garage layout assign
              -z dc1
              -c 1T
              {{ garage_node_id.stdout_lines | last | split('@') | first }}
          changed_when: true

        - name: Apply cluster layout
          # --version 1: only reached when the current version is 0 (guarded above),
          # and Garage requires apply to target current version + 1.
          # Garage 2.x layout show does not emit a parseable version tag; hardcoding is correct.
          ansible.builtin.command:
            cmd: garage layout apply --version 1
          changed_when: true

    - name: Deploy Traefik routing config for Garage S3
      ansible.builtin.template:
        src: templates/traefik-garage.yml.j2
        dest: /etc/traefik/conf.d/garage.yml
        owner: traefik
        group: traefik
        mode: "0640"
