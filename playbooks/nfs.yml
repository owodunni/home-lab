---
# NFS server + client for the storage pool
#
# What: Exports valen's MergerFS pool over NFSv4, and installs the NFS client
#       userspace on the Docker fleet so containers can mount the pool as
#       native Docker volumes (the `local` driver with type=nfs — "Option B").
# Why:  The media stack runs on valen against local disk, but some services
#       live elsewhere — e.g. Immich on a Pi — and still need the shared pool.
#       Native NFS volumes keep that storage config inside each service's
#       compose file, with no host-side fstab to maintain.
# Resolves: Cross-host access to the pool without bind-mount/fstab sprawl and
#           without making every container storage-topology aware.
#
# Prerequisites:
#   - snapraid-mergerfs.yml has run: the pool is mounted at mergerfs_mount_point
#     and its media tree is owned by the storage_media_user account.
#   - mergerfs runs with `noforget` (group_vars/storage/main.yml) so inode
#     numbers stay stable across the FUSE pool — without it NFS clients hit
#     "Stale file handle" errors.
#
# Clients reference the server by DNS name (`valen`), not IP, so the server's
# address can change without edits. The export ACL uses home_lan_subnet
# (group_vars/all.yml) so a LAN renumber is a one-line change.
#
# Consuming the export — declare a native NFS volume per service, e.g.:
#
#   volumes:
#     media:
#       driver: local
#       driver_opts:
#         type: nfs
#         o: "addr=valen,nfsvers=4,rw"
#         device: ":/media"          # → {{ mergerfs_mount_point }}/media
#   services:
#     immich:
#       user: "8000:8000"            # MUST match storage_media_uid/gid
#       volumes: [ "media:/data" ]
#
# Safe to re-run: package installs, the exports template, and exportfs are all
# idempotent.

- name: Export the storage pool over NFS
  hosts: nfs_server
  become: true

  handlers:
    - name: Reload NFS exports
      ansible.builtin.command: exportfs -ra
      changed_when: true

    # Pinned helper ports only take effect when the daemons re-exec. nfs-server
    # restart re-launches mountd and (with it) kernel lockd; rpc-statd is a
    # separate unit. A v3 client mid-operation sees a brief stall and retries
    # (hard mount semantics) — apply during the firewall rollout window.
    - name: Restart NFS server
      ansible.builtin.systemd:
        name: nfs-server
        state: restarted

    - name: Restart rpc-statd
      ansible.builtin.systemd:
        name: rpc-statd
        state: restarted

  tasks:
    - name: Install NFS server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true
        cache_valid_time: 86400 # 24h — skip refresh if cache is recent

    # What: fixes mountd/statd/lockd to the static ports declared in
    #       group_vars/nfs_server (nfs_mountd_port & friends).
    # Why:  NFSv3 — which Nextcloud's all_squash subtree export requires (see
    #       group_vars/nextcloud/main.yml) — otherwise binds these helpers to
    #       random ports at every boot, so no host-firewall port rule can cover
    #       them. NFSv4 traffic is unaffected (2049 only).
    # Resolves: stable, firewallable NFS ports for the security layer's
    #       default-deny rules (2026-07-19-host-firewalls-design.md).
    - name: Pin NFSv3 helper daemons to static ports
      ansible.builtin.template:
        src: templates/nfs-server-ports.conf.j2
        dest: /etc/nfs.conf.d/homelab-ports.conf
        mode: "0644"
        owner: root
        group: root
      notify:
        - Restart NFS server
        - Restart rpc-statd

    # What: pins lockd's ports at the kernel-module level.
    # Why:  unlike mountd/statd (userspace daemons that read /etc/nfs.conf),
    #       lockd is a kernel module and takes its ports from module
    #       parameters — Debian's nfs-utils does NOT translate the [lockd]
    #       nfs.conf section into the kernel (observed live 2026-07-19:
    #       mountd/statd pinned fine, nlockmgr still random). The [lockd]
    #       section stays in the nfs.conf drop-in for nfs-utils versions that
    #       do honor it; this file is what actually works today.
    # Resolves: nlockmgr ignoring the nfs.conf pin, which would leave NFSv3
    #       locking blocked by the firewall's fixed-port allow rules.
    - name: Persist lockd port pins as kernel module options
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (playbooks/nfs.yml). Kernel lockd reads its
          # ports from module parameters at load time, not from /etc/nfs.conf;
          # values must match nfs_lockd_port (group_vars/nfs_server) and the
          # firewall rules that reference it.
          options lockd nlm_tcpport={{ nfs_lockd_port }} nlm_udpport={{ nfs_lockd_port }}
        dest: /etc/modprobe.d/homelab-nfs-lockd.conf
        mode: "0644"
        owner: root
        group: root

    # The modprobe options only apply when the module loads (i.e. next boot).
    # The sysctls below exist while lockd is loaded and take effect when lockd
    # next rebinds its listeners — which the "Restart NFS server" handler
    # forces (lockd_down/lockd_up on nfsd stop/start). Read-then-set keeps the
    # play idempotent; the read fails harmlessly if lockd isn't loaded (then
    # modprobe.d alone covers the next load).
    - name: Read the running kernel's lockd TCP port
      ansible.builtin.command: /usr/sbin/sysctl -n fs.nfs.nlm_tcpport
      register: nfs_lockd_running_port
      changed_when: false
      failed_when: false

    - name: Apply lockd port pins to the running kernel
      ansible.builtin.command: >-
        /usr/sbin/sysctl -w fs.nfs.nlm_tcpport={{ nfs_lockd_port }}
        fs.nfs.nlm_udpport={{ nfs_lockd_port }}
      when:
        - nfs_lockd_running_port.rc == 0
        - nfs_lockd_running_port.stdout | trim != nfs_lockd_port | string
      changed_when: true
      notify: Restart NFS server

    - name: Write NFS exports table
      ansible.builtin.template:
        src: templates/exports.j2
        dest: /etc/exports
        mode: "0644"
        owner: root
        group: root
        backup: true
      notify: Reload NFS exports

    - name: Enable and start the NFS server
      ansible.builtin.systemd:
        name: nfs-server
        state: started
        enabled: true

- name: Install NFS client userspace on the Docker fleet
  hosts: nfs_client
  become: true

  handlers:
    - name: Restart rpc-statd (client)
      ansible.builtin.systemd:
        name: rpc-statd
        state: restarted

  tasks:
    # nfs-common provides /sbin/mount.nfs, which Docker's local volume driver
    # shells out to when mounting a type=nfs volume. Without it, container start
    # fails with a missing mount helper. No fstab entries are created — the
    # mount is driven entirely by each container's volume definition.
    - name: Install NFS client utilities
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true
        cache_valid_time: 86400 # 24h — skip refresh if cache is recent

    # What: fixes the client-side statd/lockd callback ports to static values.
    # Why:  an NFSv3 server (valen) makes NLM/NSM callbacks TO the client for
    #       blocking-lock grants and reboot notification; unpinned, the client
    #       binds them randomly and the client host's firewall cannot allow
    #       them, so locks would hang under default-deny. Only hosts that mount
    #       v3 declare the pin vars (today: pi-cm5-2 via group_vars/nextcloud —
    #       the only v3 client; the Docker-fleet v4 volumes need no callbacks),
    #       hence the `when`.
    # Resolves: NFSv3 locking surviving the host firewall
    #       (2026-07-19-host-firewalls-design.md).
    - name: Pin NFSv3 client callback ports
      ansible.builtin.template:
        src: templates/nfs-client-ports.conf.j2
        dest: /etc/nfs.conf.d/homelab-client-ports.conf
        mode: "0644"
        owner: root
        group: root
      when: nfs_client_statd_port is defined
      notify: Restart rpc-statd (client)

    # Same kernel-vs-daemon split as the server play: statd honors nfs.conf,
    # lockd only honors module parameters. On a CLIENT there is no service
    # restart that rebinds lockd — it re-inits when its refcount hits zero
    # (unmount + remount of the v3 mount) or at reboot. The sysctl is set now
    # so whichever of those happens first picks up the pin; until then the
    # host must not be firewalled (rollout order handles this: nfs.yml + a
    # remount/reboot before firewall.yml on the v3 client).
    - name: Persist client lockd port pins as kernel module options
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (playbooks/nfs.yml). Kernel lockd reads its
          # ports from module parameters at load time, not from /etc/nfs.conf;
          # values must match nfs_client_lockd_port (declared in the group_vars
          # of the v3-mounting service) and its firewall callback rules.
          options lockd nlm_tcpport={{ nfs_client_lockd_port }} nlm_udpport={{ nfs_client_lockd_port }}
        dest: /etc/modprobe.d/homelab-nfs-lockd.conf
        mode: "0644"
        owner: root
        group: root
      when: nfs_client_lockd_port is defined

    - name: Read the running kernel's lockd TCP port (client)
      ansible.builtin.command: /usr/sbin/sysctl -n fs.nfs.nlm_tcpport
      register: nfs_client_lockd_running_port
      changed_when: false
      failed_when: false
      when: nfs_client_lockd_port is defined

    - name: Apply client lockd port pins to the running kernel
      ansible.builtin.command: >-
        /usr/sbin/sysctl -w fs.nfs.nlm_tcpport={{ nfs_client_lockd_port }}
        fs.nfs.nlm_udpport={{ nfs_client_lockd_port }}
      when:
        - nfs_client_lockd_port is defined
        - nfs_client_lockd_running_port.rc == 0
        - nfs_client_lockd_running_port.stdout | trim != nfs_client_lockd_port | string
      changed_when: true
