---
# Deploy Loki log store on the monitoring host, backed by Garage S3.
#
# What: Provisions a `loki` bucket + API key on Garage (valen), then installs
#       Loki (grafana.grafana.loki) on the [monitoring] host bound to loopback
#       :3100, storing chunks + index in that bucket. Drops a Traefik dynamic
#       config so loki.jardoole.xyz routes to Loki behind a basic-auth
#       middleware — the endpoint Alloy agents (playbooks/alloy.yml) push to.
# Why:  Metrics see a container down; only logs saw Jellyseerr's container stay
#       Up while every DNS lookup failed. Loki is the store for that log layer,
#       and its ruler alerts on fatal patterns via the existing Alertmanager.
#       Garage S3 keeps bulk log writes off the Pi's small eMMC (see the storage
#       decision in the design spec + group_vars/monitoring/main.yml).
# Resolves: no central log store + no log-based alerting.
#
# Prerequisites:
#   - Garage installed and running on the [garage] host (service-infra layer,
#     which the monitoring layer runs after). The first play needs the `garage`
#     CLI to provision the bucket/key.
#   - Traefik running on the monitoring host with conf.d at /etc/traefik/conf.d
#     (pi-cm5-1 is in [ingress]).
#
# Vault vars required in group_vars/monitoring/vault.yml:
#   vault_loki_s3_access_key   — Garage access key, "GK" + 24 hex chars
#   vault_loki_s3_secret_key   — Garage secret, 64 hex chars
#     Generate the pair yourself before first run (no copy-paste from a created
#     key): scripts/garage-keygen.sh vault_loki_s3
#   vault_loki_push_htpasswd   — the BARE password hash for the Traefik
#     basic-auth middleware (NO "user:" prefix — the traefik-loki.yml.j2 template
#     prepends loki_push_username). Generate with:
#       openssl passwd -apr1 '<password>'
#     using the same password as the Alloy agents' vault_loki_push_password in
#     group_vars/all/vault.yml.

- name: Provision the Loki bucket and key on Garage
  # Runs on the Garage host (valen) — the `garage` CLI lives there. Credentials
  # and the bucket name travel with the Loki config on the [monitoring] host,
  # pulled here via hostvars so this play needs no edit if Loki moves. All checks
  # short-circuit on re-runs. Mirrors playbooks/authentik.yml's first play.
  hosts: garage
  become: true
  vars:
    _loki_host: "{{ groups['monitoring'][0] }}"
    _garage_resources:
      - bucket: "{{ hostvars[_loki_host]['loki_s3_bucket'] }}"
        access_key: "{{ hostvars[_loki_host]['vault_loki_s3_access_key'] }}"
        secret_key: "{{ hostvars[_loki_host]['vault_loki_s3_secret_key'] }}"
  tasks:
    - name: List existing Garage buckets
      ansible.builtin.command:
        cmd: garage bucket list
      register: garage_bucket_list
      changed_when: false

    - name: Create the Loki bucket
      when: item.bucket not in garage_bucket_list.stdout
      ansible.builtin.command:
        cmd: garage bucket create {{ item.bucket }}
      loop: "{{ _garage_resources }}"
      loop_control:
        label: "{{ item.bucket }}"
      changed_when: true

    - name: List existing Garage API keys
      ansible.builtin.command:
        cmd: garage key list
      register: garage_key_list
      changed_when: false

    - name: Import the vaulted Loki API key
      # Bring-your-own creds so a rebuilt Garage accepts the same key with no
      # manual step. --yes bypasses the interactive import confirmation.
      when: item.bucket not in garage_key_list.stdout
      ansible.builtin.command:
        cmd: >
          garage key import --yes
          -n {{ item.bucket }}
          {{ item.access_key }}
          {{ item.secret_key }}
      loop: "{{ _garage_resources }}"
      loop_control:
        label: "{{ item.bucket }}"
      no_log: true  # secret key is on the command line
      changed_when: true

    - name: Read current grants on the Loki bucket
      ansible.builtin.command:
        cmd: garage bucket info {{ item.bucket }}
      loop: "{{ _garage_resources }}"
      loop_control:
        label: "{{ item.bucket }}"
      register: garage_bucket_info
      changed_when: false

    - name: Grant the key read/write on its bucket
      # Decoupled from key existence so an interrupted first run (key imported,
      # grant skipped) self-heals on re-run — keying off the actual grant state.
      # Bucket is positional here (unlike `garage key import -n`, a flag).
      when: item.item.access_key not in item.stdout
      ansible.builtin.command:
        cmd: >
          garage bucket allow
          {{ item.item.bucket }}
          --read --write
          --key {{ item.item.access_key }}
      loop: "{{ garage_bucket_info.results }}"
      loop_control:
        label: "{{ item.item.bucket }}"
      changed_when: true

- name: Deploy Loki log store
  hosts: monitoring
  become: true

  roles:
    - role: grafana.grafana.loki

  tasks:
    - name: Deploy Traefik routing config for Loki
      ansible.builtin.template:
        src: templates/traefik-loki.yml.j2
        dest: /etc/traefik/conf.d/loki.yml
        owner: traefik
        group: traefik
        mode: "0640"
