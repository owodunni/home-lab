---
# Install and configure MergerFS + SnapRAID storage pool
#
# What: Creates ext4 filesystems on open LUKS devices, mounts them, installs
#       MergerFS to pool data drives into a single mount, installs SnapRAID
#       for parity protection, and lays out the base directory structure.
# Why:  MergerFS + SnapRAID gives a flexible, expandable storage pool with
#       single-drive-failure recovery without the overhead of RAID rebuilds.
# Resolves: The need to go from open LUKS block devices to a usable, protected
#           storage pool in one idempotent step.
#
# Prerequisites:
#   - disk-encrypt.yml must have run successfully (LUKS devices open)
#   - storage_drives, mergerfs_* vars defined
#   - snapraid_* vars are optional (see snapraid_configured below) — a host
#     with data drives but no parity drive yet just gets MergerFS
#
# Safe to re-run: filesystem creation uses force: false (skips if fs exists);
# package installs and config writes are idempotent.

- name: Configure MergerFS + SnapRAID storage pool
  hosts: storage
  become: true

  # SnapRAID needs a parity drive, data drives, and content file locations to
  # produce a valid snapraid.conf. Until all three are set (e.g. a new storage
  # node with data drives only), skip SnapRAID instead of writing a broken
  # config — this keeps `make storage` from aborting over a missing parity
  # drive that hasn't arrived yet.
  vars:
    snapraid_configured: >-
      {{ (snapraid_parity_drives | default([]) | length > 0)
         and (snapraid_data_drives | default([]) | length > 0)
         and (snapraid_content_files | default([]) | length > 0) }}

  tasks:
    # ========================================================================
    # Individual drive filesystems and mounts
    # ========================================================================

    - name: Create mount points for each drive
      ansible.builtin.file:
        path: "{{ item.mount_point }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      loop: "{{ storage_drives }}"

    - name: Create ext4 filesystem on each LUKS device
      community.general.filesystem:
        fstype: "{{ storage_filesystem }}"
        dev: "/dev/mapper/{{ item.crypt_name }}"
        opts: "-L {{ item.label }}"
        force: false
      loop: "{{ storage_drives }}"

    - name: Mount all drives
      ansible.posix.mount:
        path: "{{ item.mount_point }}"
        src: "/dev/mapper/{{ item.crypt_name }}"
        fstype: "{{ storage_filesystem }}"
        opts: "{{ storage_mount_options }}"
        state: mounted
        backup: true
      loop: "{{ storage_drives }}"

    # ========================================================================
    # MergerFS
    # ========================================================================

    - name: Check if MergerFS is already installed
      ansible.builtin.stat:
        path: /usr/bin/mergerfs
      register: mergerfs_binary

    - name: Download MergerFS .deb package
      ansible.builtin.get_url:
        url: "https://github.com/trapexit/mergerfs/releases/download/\
          {{ mergerfs_version }}/mergerfs_{{ mergerfs_version }}.debian-bookworm_amd64.deb"
        dest: /tmp/mergerfs.deb
        mode: "0644"
      when: not mergerfs_binary.stat.exists

    - name: Install MergerFS
      ansible.builtin.apt:
        deb: /tmp/mergerfs.deb
        state: present
      when: not mergerfs_binary.stat.exists

    - name: Create MergerFS pool mount point
      ansible.builtin.file:
        path: "{{ mergerfs_mount_point }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Configure MergerFS pool in /etc/fstab
      ansible.posix.mount:
        path: "{{ mergerfs_mount_point }}"
        src: "{{ mergerfs_data_drives | join(':') }}"
        fstype: fuse.mergerfs
        opts: "{{ mergerfs_options }}"
        state: mounted
        backup: true

    # A dedicated unprivileged account owns the media tree so containers — both
    # local on this host and remote over NFS (playbooks/nfs.yml) — can write
    # without running as root. UID/GID are fixed (group_vars/storage/main.yml)
    # because NFSv4 sec=sys matches on numeric IDs, so client containers must
    # run with the same PUID/PGID. See group_vars/storage/main.yml for rationale.
    - name: Create media group
      ansible.builtin.group:
        name: "{{ storage_media_user }}"
        gid: "{{ storage_media_gid }}"
        system: true
        state: present

    - name: Create media service account
      ansible.builtin.user:
        name: "{{ storage_media_user }}"
        uid: "{{ storage_media_uid }}"
        group: "{{ storage_media_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        state: present

    - name: Create base directory structure in storage pool
      ansible.builtin.file:
        path: "{{ mergerfs_mount_point }}/{{ item }}"
        state: directory
        # 2775 = setgid bit so files created by any container inherit the media
        # group, keeping the whole tree group-writable across NFS clients.
        mode: "2775"
        owner: "{{ storage_media_user }}"
        group: "{{ storage_media_user }}"
      loop:
        - media
        - media/library
        - media/library/movies
        - media/library/tv

    # ========================================================================
    # SnapRAID
    # ========================================================================

    - name: Warn when SnapRAID is not yet configured
      ansible.builtin.debug:
        msg: >-
          Skipping SnapRAID: snapraid_parity_drives, snapraid_data_drives and
          snapraid_content_files are not all set. Define them in
          host_vars/<host>/main.yml once a parity drive is added, then re-run
          `make snapraid-mergerfs`.
      when: not (snapraid_configured | bool)

    - name: Install, configure, and prepare SnapRAID
      when: snapraid_configured | bool
      block:
        - name: Install SnapRAID build dependencies
          ansible.builtin.apt:
            name:
              - build-essential
              - git
              - wget
            state: present
            update_cache: true
            cache_valid_time: 86400 # 24h — skip refresh if cache is recent

        - name: Check if SnapRAID is already installed
          ansible.builtin.stat:
            path: /usr/local/bin/snapraid
          register: snapraid_binary

        - name: Download SnapRAID source tarball
          ansible.builtin.get_url:
            url: "https://github.com/amadvance/snapraid/releases/download/v{{ snapraid_version }}/snapraid-{{ snapraid_version }}.tar.gz"
            dest: "/tmp/snapraid-{{ snapraid_version }}.tar.gz"
            mode: "0644"
          when: not snapraid_binary.stat.exists

        - name: Extract SnapRAID source
          ansible.builtin.unarchive:
            src: "/tmp/snapraid-{{ snapraid_version }}.tar.gz"
            dest: /tmp/
            remote_src: true
            creates: "/tmp/snapraid-{{ snapraid_version }}"
          when: not snapraid_binary.stat.exists

        - name: Build and install SnapRAID
          ansible.builtin.shell: |
            cd /tmp/snapraid-{{ snapraid_version }}
            ./configure
            make
            make install
          args:
            creates: /usr/local/bin/snapraid
          when: not snapraid_binary.stat.exists

        - name: Write SnapRAID configuration
          ansible.builtin.template:
            src: templates/snapraid.conf.j2
            dest: /etc/snapraid.conf
            mode: "0644"
            owner: root
            group: root
            backup: true

        - name: Remind operator to run initial SnapRAID sync
          ansible.builtin.debug:
            msg: >-
              SnapRAID installed. Run the initial parity sync manually once data is
              in place: ssh {{ inventory_hostname }} 'snapraid sync'
              This takes 1-2 hours for empty drives.
