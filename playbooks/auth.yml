---
# Auth layer
#
# What: Deploys the identity provider (Authentik) that all downstream services
#       use for SSO/OIDC. This layer runs before the applications and monitoring
#       layers so they can configure their OIDC integration against a live
#       Authentik.
# Why:  Auth is foundational infrastructure — like ingress, everything downstream
#       depends on it being alive. Separating it into its own layer makes the
#       dependency explicit and enforces it structurally rather than by convention.
# Resolves: Ordering guarantee that Authentik is live before any service tries
#           to configure SSO against it.
#
# Order: After service-infra (Docker must be installed before the compose stack
#        can run, and Garage must be up — Authentik provisions its backup bucket
#        there). Before applications and monitoring (which configure SSO against
#        Authentik).

- name: Auth | Authentik identity provider
  ansible.builtin.import_playbook: authentik.yml
