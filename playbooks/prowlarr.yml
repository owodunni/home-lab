---
# Deploy Prowlarr (indexer/tracker manager) and register its Traefik route
#
# What: Deploys the Prowlarr stack on valen and registers the
#       prowlarr.jardoole.xyz route (behind Authentik forward-auth) with the
#       co-located Traefik.
# Why:  Prowlarr is the indexer source for Radarr/Sonarr — it must exist before
#       them so they can sync indexers from it. Service 2 of the media-stack
#       migration (see docs/media-stack-migration.md).
# Resolves: Centralizes indexer management so each *arr app does not configure
#           indexers separately.
#
# Prerequisites:
#   - Docker runtime on valen (service-infra layer; valen in [services]).
#   - Traefik on valen with conf.d (ingress layer; valen in [ingress]).
#   - Forward-auth middleware deployed (playbooks/media-forward-auth.yml) and the
#     Authentik provider/application created, with an Expression Policy bypassing
#     /api so Radarr/Sonarr can reach Prowlarr's API (see
#     docs/media-stack-migration.md).
#   - Garage up on the [garage] host (service-infra layer) — the first play below
#     provisions the config-backup bucket/key with the `garage` CLI there.
#
# Vault vars required in group_vars/prowlarr/vault.yml:
#   vault_prowlarr_backup_s3_access_key / _secret_key — Garage key (GK+24 hex /
#     64 hex) for the config-backup bucket; generate before first run with
#       scripts/garage-keygen.sh vault_prowlarr_backup_s3
#   vault_prowlarr_restic_password — restic repo password (openssl rand -base64
#     32). Losing it makes existing config snapshots unrecoverable.
# After first run, also vault the Prowlarr API key (Settings → General → Security)
# as vault_prowlarr_api_key for Radarr/Sonarr to consume later.

- name: Provision the Prowlarr config-backup bucket and key on Garage
  # Runs on the Garage host (valen) because the `garage` CLI lives there. Kept in
  # this service playbook (not the garage layer) so backup provisioning travels
  # with the Prowlarr service. Garage is already up (service-infra precedes
  # applications). Every check short-circuits on re-runs.
  hosts: garage
  become: true
  vars:
    # Single source of truth: the bucket name and credentials live with the service
    # in group_vars/prowlarr, pulled here via the [prowlarr] group so this play
    # needs no edit when Prowlarr moves hosts.
    _prowlarr_host: "{{ groups['prowlarr'][0] }}"
    _bucket: "{{ hostvars[_prowlarr_host]['prowlarr_backup_s3_bucket'] }}"
    _access_key: "{{ hostvars[_prowlarr_host]['vault_prowlarr_backup_s3_access_key'] }}"
    _secret_key: "{{ hostvars[_prowlarr_host]['vault_prowlarr_backup_s3_secret_key'] }}"
  tasks:
    - name: List existing Garage buckets
      ansible.builtin.command:
        cmd: garage bucket list
      register: garage_bucket_list
      changed_when: false

    - name: Create the Prowlarr backup bucket
      # Idempotent: only runs when the bucket does not yet exist.
      when: _bucket not in garage_bucket_list.stdout
      ansible.builtin.command:
        cmd: garage bucket create {{ _bucket }}
      changed_when: true

    - name: List existing Garage API keys
      ansible.builtin.command:
        cmd: garage key list
      register: garage_key_list
      changed_when: false

    - name: Import the vaulted backup API key
      # Idempotent: only runs when the key (matched by name) does not yet exist.
      # Bring-your-own creds so a rebuilt Garage accepts the same key with no
      # manual step. Garage validates the format; --yes bypasses the confirm guard.
      when: _bucket not in garage_key_list.stdout
      ansible.builtin.command:
        cmd: >
          garage key import --yes
          -n {{ _bucket }}
          {{ _access_key }}
          {{ _secret_key }}
      no_log: true  # secret key is on the command line
      changed_when: true

    - name: Read current grants on the backup bucket
      ansible.builtin.command:
        cmd: garage bucket info {{ _bucket }}
      register: garage_bucket_info
      changed_when: false

    - name: Grant the key read/write access to its backup bucket
      # Decoupled from key existence on purpose: gating this on the key import guard
      # would mean a failed/interrupted grant could never re-run, leaving a valid
      # key with no bucket access (silent "Access Denied" in the sidecar). Keying
      # off the actual grant state makes it idempotent and self-healing.
      when: _access_key not in garage_bucket_info.stdout
      ansible.builtin.command:
        cmd: >
          garage bucket allow
          {{ _bucket }}
          --read --write
          --key {{ _access_key }}
      changed_when: true

- name: Deploy Prowlarr and register its Traefik route
  hosts: prowlarr
  become: true

  roles:
    - role: prowlarr

  tasks:
    - name: Deploy Traefik routing config for Prowlarr
      ansible.builtin.template:
        src: templates/traefik-prowlarr.yml.j2
        dest: /etc/traefik/conf.d/prowlarr.yml
        owner: traefik
        group: traefik
        mode: "0640"
