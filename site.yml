---
# Site playbook — full provisioning from scratch
#
# What: Runs every layer in sequence to take a fresh host from first boot to a
#       fully provisioned, hardened state.
# Why:  Provides one command to provision the whole fleet end to end, while each
#       layer (and each function playbook within it) stays independently
#       runnable for targeted changes.
# Resolves: The need for a reproducible bootstrap that fixes layer ordering in one
#           place — system → networking → storage → ingress → service-infra →
#           auth → applications → backup → monitoring → security.
#
# Order is significant: each layer assumes the previous one has completed.
- name: System layer — base OS and hardware configuration
  ansible.builtin.import_playbook: playbooks/system.yml

- name: Networking layer — WireGuard peers for cross-site connectivity
  ansible.builtin.import_playbook: playbooks/networking.yml

- name: Storage layer — encrypted drives, MergerFS pool, SnapRAID parity, media tree
  ansible.builtin.import_playbook: playbooks/storage.yml

- name: Ingress layer — Traefik reverse proxy with ACME
  ansible.builtin.import_playbook: playbooks/ingress.yml

- name: Service Infrastructure layer — Docker runtime and Garage S3 backend
  ansible.builtin.import_playbook: playbooks/service-infra.yml

- name: Auth layer — Authentik identity provider (SSO/OIDC for all services)
  ansible.builtin.import_playbook: playbooks/auth.yml

- name: Applications layer — end-user services (Nextcloud, media stack)
  ansible.builtin.import_playbook: playbooks/applications.yml

- name: Backup layer — offsite mirror of service backups (valen Garage → beelink)
  ansible.builtin.import_playbook: playbooks/backup.yml

- name: Monitoring layer — node_exporter, Prometheus, Alertmanager, Grafana
  ansible.builtin.import_playbook: playbooks/monitoring.yml

- name: Security layer — hardening
  ansible.builtin.import_playbook: playbooks/security.yml
