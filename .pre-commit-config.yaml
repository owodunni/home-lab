---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: make-lint
        name: make lint
        entry: make lint
        language: system
        files: \.(yml|yaml)$
        pass_filenames: false

      - id: lint-apps
        name: lint apps
        entry: make lint-apps
        language: system
        files: ^apps/.*/values.*\.yml$
        pass_filenames: false

      - id: blackbox-coverage
        name: blackbox monitoring coverage
        entry: uv run python scripts/check-blackbox-coverage.py
        language: system
        files: ^(playbooks/templates/traefik-.*\.yml\.j2|group_vars/monitoring/main\.yml)$
        pass_filenames: false

      - id: port-inventory
        name: port inventory drift check
        entry: uv run python scripts/render-port-inventory.py --check
        language: system
        files: ^(hosts\.ini|group_vars/.*\.yml|host_vars/.*\.yml|docs/port-inventory\.md|scripts/render-port-inventory\.py)$
        pass_filenames: false

      - id: firewall-ascii
        name: firewall rule/template ASCII check
        entry: uv run python scripts/check-firewall-ascii.py
        language: system
        files: ^((group|host)_vars/.*\.yml|roles/firewall/templates/docker-user-block-v[46]\.j2|scripts/check-firewall-ascii\.py)$
        pass_filenames: false
