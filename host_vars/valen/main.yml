---
# Valen — storage server
# Hardware: 1x Seagate IronWolf 12TB HDD (sda). 2 more IronWolf 12TB drives
# planned — add them to storage_drives and mergerfs_data_drives below, and
# define snapraid_parity_drives/snapraid_data_drives/snapraid_content_files
# (see group_vars/storage/main.yml) once a parity drive is in place.

# ============================================================================
# Drive Layout
# ============================================================================
# Single data drive for now, LUKS-encrypted; ext4 formatted on the decrypted
# device.
# spindown: true opts this drive into disk-spindown.yml — valen is only used
# occasionally, so its HDD spins down when idle to save power and reduce wear.
# (beelink's NVMe drives have no spindown key and are skipped.)
storage_drives:
  - device: /dev/disk/by-id/ata-ST12000VN0008-3MH101_ZZ30G3SR
    label: disk1
    mount_point: /mnt/disk1
    crypt_name: disk1_crypt
    spindown: true

# ============================================================================
# MergerFS
# ============================================================================
# Single-drive pool — additional data drives append here as they're added.
mergerfs_data_drives:
  - /mnt/disk1

# ============================================================================
# Garage — S3-compatible object storage
# ============================================================================
# Garage runs here (not on beelink) so every service backs up to a LOCAL S3
# target on the home LAN instead of pushing over WireGuard to the offsite node;
# beelink then pulls these buckets to make the offsite copy (see hosts.ini
# [garage]/[backup_mirror] and playbooks/backup-mirror.yml).
# Metadata (sqlite index) on the local OS SSD for fast access; object data on the
# MergerFS pool so SnapRAID provides parity protection.
# NOTE: requires host_vars/valen/vault.yml with vault_garage_rpc_secret and
# vault_garage_admin_token (generate per the garage role; they moved off beelink).
garage_metadata_dir: /var/lib/garage/meta
garage_data_dir: "{{ mergerfs_mount_point }}/garage"

# ============================================================================
# smartctl_exporter — poll interval override
# ============================================================================
# What: Poll SMART hourly instead of the 60s group default.
# Why:  valen's HDD spins down after 20 min idle (disk-spindown.yml). A SMART
#       read wakes a standby drive and smartctl_exporter has no skip-standby
#       flag, so a 60s poll would keep the drive spinning 24/7 and defeat
#       spin-down. SMART attributes move slowly, so hourly resolution is ample
#       for health/alerting while letting the drive sleep between brief wakes.
# Resolves: Conflict between SMART polling and HDD spin-down on this host.
smartctl_exporter_smartctl_interval: "1h"
